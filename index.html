<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>발성 훈련 기록</title>
<meta name="theme-color" content="#2f5bd3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="발성 훈련">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#15181e; --sub:#5b6270; --line:#e3e6eb;
    --accent:#2f5bd3; --accent-ink:#ffffff; --tint:#e8eefc; --tint2:#c9d6f6;
    --ok:#1f8a5b; --shadow:0 1px 2px rgba(20,24,30,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1115; --card:#181b21; --ink:#eef0f4; --sub:#a1a8b5; --line:#2a2f38;
      --accent:#7b9cff; --accent-ink:#0f1115; --tint:#1e2740; --tint2:#33467a; --ok:#5cc596; --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1115; --card:#181b21; --ink:#eef0f4; --sub:#a1a8b5; --line:#2a2f38;
    --accent:#7b9cff; --accent-ink:#0f1115; --tint:#1e2740; --tint2:#33467a; --ok:#5cc596; --shadow:none;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
    -webkit-tap-highlight-color:transparent;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
  button{font:inherit;color:inherit}
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px 24px}
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 0 16px}
  .dday{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .dsub{font-size:13px;color:var(--sub);margin-top:6px}
  .badge{display:inline-flex;align-items:center;background:var(--tint);color:var(--accent);font-weight:600;font-size:13px;padding:6px 10px;border-radius:999px;white-space:nowrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .card h3{margin:0;font-size:15px;font-weight:600}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .muted{color:var(--sub);font-size:13px}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
  .seg button{border:0;background:transparent;padding:10px 8px;border-radius:10px;font-weight:600;font-size:15px;cursor:pointer;min-height:44px}
  .seg button.on{background:var(--accent);color:var(--accent-ink)}
  .seg small{display:block;font-weight:500;font-size:12px;opacity:.8;margin-top:2px}
  .btn{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font-weight:600;font-size:14px;cursor:pointer;min-height:44px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.big{width:100%;min-height:60px;font-size:18px;letter-spacing:.02em}
  .btn.danger{color:#c0392b}
  .btn:disabled{opacity:.45}
  .actions{display:flex;gap:8px;margin-top:14px;width:100%}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px;min-width:44px;font-size:14px;cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .field{display:grid;gap:8px;margin-top:14px}
  .field > span{font-size:13px;color:var(--sub);font-weight:500}
  input[type=text],input[type=date],textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 12px;font:inherit;font-size:15px;min-height:44px}
  textarea{resize:vertical;min-height:64px}

  /* 루틴 개요 */
  .plan-list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
  .plan-list li{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px}
  .plan-list .n{width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--accent);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
  .plan-list .t{flex:1;min-width:0}
  .plan-list b{display:block;font-size:14px}
  .plan-list .ok{background:var(--accent);color:var(--accent-ink)}
  .stamp{text-align:center;padding:20px 8px 8px}
  .stamp .seal{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:132px;height:132px;border-radius:50%;border:4px solid var(--ok);color:var(--ok);transform:rotate(-8deg);font-weight:700}
  .stamp .seal b{font-size:22px}
  .stamp .seal span{font-size:12px}

  /* 플레이어 */
  .player{padding:16px 16px 18px;transition:background .3s,border-color .3s}
  .player.resting{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .player.resting .muted,.player.resting .stage-chip{color:var(--accent-ink);opacity:.9}
  .stage-chip{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
  .stage-name{font-size:18px;font-weight:700;margin:2px 0 0}
  .viz{height:220px;display:flex;align-items:center;justify-content:center;margin:12px 0 4px;position:relative}
  .cue{text-align:center;font-size:22px;font-weight:700;margin-top:4px;min-height:30px}
  .cue-sub{text-align:center;font-size:14px;color:var(--sub);margin-top:4px;min-height:20px}
  .player.resting .cue-sub{color:var(--accent-ink)}
  .count{display:flex;justify-content:center;gap:16px;margin-top:14px;font-size:14px;font-weight:600}
  .count span{background:var(--bg);border-radius:999px;padding:6px 12px}
  .player.resting .count span{background:rgba(255,255,255,.18)}
  .ctrl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
  .ctrl .btn{font-size:13px;padding:10px 6px}
  .player.resting .ctrl .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:var(--accent-ink)}
  .bigtime{font-size:76px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
  .circle{width:200px;height:200px;border-radius:50%;background:var(--tint);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;transition:transform .1s linear}
  .circle span{font-size:40px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .stairs{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:170px;width:100%}
  .stairs i{flex:1;max-width:30px;border-radius:6px 6px 2px 2px;background:var(--line);transition:background .15s}
  .stairs i.on{background:var(--accent)}
  .stairs i.past{background:var(--tint2)}
  .metro{margin-top:12px;display:flex;justify-content:center}

  /* 기구·들숨 태그 */
  .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  .tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--bg);color:var(--sub);border:1px solid var(--line);white-space:nowrap}
  .tag.t-h3,.tag.t-h2,.tag.t-lips{background:var(--tint);color:var(--accent);border-color:var(--tint2)}
  .tag.t-none{background:transparent}
  .tag.i-dev{color:#b07a00;border-color:#f0d58a;background:#fff7dc}
  .tag.i-nose,.tag.i-mouth,.tag.i-pant,.tag.i-empty,.tag.i-bend{color:var(--ok);border-color:rgba(31,138,91,.35);background:rgba(31,138,91,.08)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag.i-dev{background:#3a2f12;border-color:#6b5520;color:#f2c94c} }
  .mini-tags .tags{margin-top:0}
  .player.resting .tag{background:rgba(255,255,255,.18);color:var(--accent-ink);border-color:transparent}
  .goal-line{margin:6px 0 0;font-size:13px;font-weight:600;color:var(--accent)}
  .plan-list .mins{flex:none;font-variant-numeric:tabular-nums}
  .plan-list .n{width:auto;min-width:30px;padding:0 6px;border-radius:999px}
  /* 타임라인 */
  .tl{display:flex;gap:3px;margin-top:12px;height:26px}
  .tl i{border-radius:6px;display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden}
  .tl i span{font-size:10px;font-weight:700;font-style:normal;color:var(--accent-ink);white-space:nowrap}
  .tl .g1{background:#7a95e8}.tl .g2{background:#e0a400}.tl .g3{background:#5b7fe0}.tl .g4{background:var(--accent)}.tl .g5{background:#1f8a5b}.tl .g6{background:#8b5cf6}.tl .g7{background:#0e9f9a}.tl .g8{background:#d9468f}.tl .g9{background:#c2410c}
  /* 몸 그림 */
  .viz2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:8px;align-items:center;width:100%}
  .vright{min-width:0}
  .figbox{position:relative}
  .figbox.lg{width:min(100%,260px);height:236px}
  .figbox.sm{width:100%;height:200px}
  .figbox .bf{width:100%;height:100%;display:block}
  .figtime{position:absolute;top:0;left:0;font-size:38px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .prepbox{text-align:center;display:grid;gap:10px;justify-items:center}
  .prep-tags .tags{justify-content:center}
  .prep-tags .tag{font-size:13px;padding:5px 12px}
  .bf .bf-skin{fill:var(--card);stroke:var(--sub);stroke-width:1.4}
  .bf .bf-torso{stroke:var(--sub);stroke-width:1.4}
  .bf .bf-g1{stop-color:var(--card)} .bf .bf-g2{stop-color:var(--tint)}
  .bf .bf-lung{fill:var(--tint2);opacity:.8}
  .bf .bf-pipe{fill:none;stroke:var(--tint2);stroke-width:5;stroke-linecap:round}
  .bf .bf-dia{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}
  .bf .bf-band{fill:#f2b705;opacity:0;transition:opacity .2s}
  .bf .bf-lar{fill:#e0a400;stroke:var(--card);stroke-width:1.5}
  .bf .bf-lar.bad{fill:#d9534f}
  .bf .bf-dev rect{fill:var(--accent)}
  .bf .bf-dev circle{fill:var(--card)}
  .bf .bf-ahd{fill:var(--accent)}
  .bf .bf-flow{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-dasharray:6 6;stroke-linecap:round;opacity:0;transition:opacity .2s}
  .bf .bf-flow.on{opacity:1;animation:bfdash .55s linear infinite}
  .bf .bf-flow.slow{animation-duration:1.5s}
  .bf .bf-flow.fast{animation-duration:.22s}
  @keyframes bfdash{to{stroke-dashoffset:-12}}
  .bf .bf-tissue{fill:var(--card);stroke:var(--sub);stroke-width:1.2}
  .bf .bf-pin{stroke:var(--sub);stroke-width:2;stroke-linecap:round}
  .bf .bf-ring{fill:none;stroke:var(--accent);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
  .bf .bf-ring.on{animation:bfring 1.3s ease-out infinite}
  .bf .bf-ring.b.on{animation-delay:.65s}
  @keyframes bfring{0%{transform:scale(.3);opacity:.85}100%{transform:scale(1.1);opacity:0}}
  .bf .bf-t{font-size:10px;fill:var(--sub)}
  .bf .bf-lab{font-size:13px;font-weight:700;fill:var(--accent)}
  .player.resting .bf .bf-lab{fill:var(--accent-ink)}
  @media (prefers-reduced-motion: reduce){ .bf .bf-flow.on,.bf .bf-ring.on{animation:none} .bf .bf-ring.on{opacity:.5} }
  /* 가이드 그림 */
  .demo-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:4px}
  .demo-row.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .demo{background:var(--bg);border-radius:12px;padding:6px 4px 2px;text-align:center}
  .demo .bf{width:100%;height:auto;display:block}
  .demo .bf .bf-lab{font-size:15px}
  .demo-cap{font-size:12px;font-weight:700;padding:2px 0 6px}
  table.cmp td:first-child{white-space:nowrap}
  .legend-fig{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--sub)}
  .legend-fig i{display:inline-block;width:14px;height:8px;border-radius:4px;vertical-align:1px;margin-right:4px}
  .check{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
  .check li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:14px;line-height:1.5}
  .check li b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;display:flex;align-items:center;justify-content:center}
  table.cmp{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  table.cmp th,table.cmp td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
  table.cmp th{font-size:12px;color:var(--sub);font-weight:600}
  .src{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.6}

  /* 설명 (기본 접힘) */
  details.explain{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
  details.explain summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--sub);list-style:none;display:flex;justify-content:space-between;min-height:28px;align-items:center}
  details.explain summary::-webkit-details-marker{display:none}
  details.explain summary::after{content:'펼치기';font-weight:500}
  details.explain[open] summary::after{content:'접기'}
  .player.resting details.explain summary{color:var(--accent-ink)}
  dl.guide{display:grid;grid-template-columns:76px 1fr;gap:8px 10px;margin:10px 0 0;font-size:13px;line-height:1.55}
  dl.guide dt{font-weight:600}
  dl.guide dd{margin:0;color:var(--sub)}
  .player.resting dl.guide dd{color:var(--accent-ink)}

  /* 하단 전체 진행률 */
  .meter{position:relative;height:22px;background:var(--bg);border:1px solid var(--line);border-radius:11px;margin:6px 0 4px;overflow:hidden}
  .meter .zone{position:absolute;top:0;bottom:0}
  .meter .zone.singer{background:var(--tint2);opacity:.7}
  .meter .zone.goal{border-left:2px solid var(--ok);border-right:2px solid var(--ok);background:rgba(31,138,91,.12)}
  .meter .dot{position:absolute;top:2px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#e0a400;transition:left .08s linear;box-shadow:0 0 0 2px var(--card)}
  .auto{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--sub);cursor:pointer}
  .auto input{width:18px;height:18px;accent-color:var(--accent)}
  .progress-dock{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:6;background:var(--card);border-top:1px solid var(--line);padding:8px 16px}
  .progress-dock .in{max-width:520px;margin:0 auto}
  .progress-dock .row{font-size:12px;color:var(--sub);margin-bottom:5px}
  .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .2s linear}

  /* 기록 */
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center}
  .stat b{display:block;font-size:20px;font-weight:700}
  .stat span{font-size:12px;color:var(--sub)}
  .grid{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:4px;margin-top:12px;align-items:center}
  .grid .h{font-size:11px;color:var(--sub);text-align:center}
  .grid .wk{font-size:11px;color:var(--sub);line-height:1.2}
  .grid .wk b{display:block;color:var(--ink);font-size:12px}
  .cell{border:0;padding:3px;border-radius:8px;background:transparent;cursor:pointer;display:grid;grid-template-rows:auto 1fr 1fr;gap:2px;aspect-ratio:1/1.15;min-height:44px}
  .cell .d{font-size:10px;color:var(--sub);text-align:center;line-height:1.2}
  .cell .h2{border-radius:4px;background:var(--line)}
  .cell .h2.p{background:var(--tint2)}
  .cell .h2.f{background:var(--accent)}
  .cell.future .h2{background:transparent;border:1px dashed var(--line)}
  .cell.today{outline:2px solid var(--accent);outline-offset:-1px}
  .stageline{grid-column:1/-1;font-size:11px;font-weight:600;color:var(--accent);margin-top:8px}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--sub)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
  .wtable{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:4px;margin-top:12px;font-size:12px;text-align:center}
  .wtable .c{height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--line)}
  .wtable .c.f{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .wtable .c.p{background:var(--tint2);border-color:var(--tint2)}
  .wtable .lbl{display:flex;align-items:center;color:var(--sub)}

  /* 효과 */
  .lead{background:var(--tint);border-color:var(--tint2)}
  .lead b{font-size:16px;line-height:1.5;display:block}
  .lead p{margin:8px 0 0;font-size:14px;color:var(--sub);line-height:1.6}
  details.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;box-shadow:var(--shadow)}
  details.ex summary{padding:16px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;min-height:52px}
  details.ex summary::-webkit-details-marker{display:none}
  details.ex summary::after{content:'+';margin-left:auto;color:var(--sub);font-size:20px;font-weight:400}
  details.ex[open] summary::after{content:'−'}
  details.ex .body{padding:0 16px 16px}
  .exn{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .roadmap{display:grid;gap:6px;margin-top:4px;font-size:13px}
  .roadmap div{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--bg);border-radius:10px}
  .roadmap div.now{background:var(--tint);outline:1.5px solid var(--accent)}
  .roadmap b{font-weight:600}
  .elist{margin:8px 0 0;padding-left:18px;font-size:14px;line-height:1.7}
  .rule{margin-top:4px;background:var(--bg);border-radius:10px;padding:12px}
  .rule p{margin:6px 0 0;font-size:13px;color:var(--sub);line-height:1.6}

  /* 탭 */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:7}
  nav.tabs button{border:0;background:none;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--sub);cursor:pointer;min-height:52px}
  nav.tabs button.on{color:var(--accent);font-weight:600}
  nav.tabs svg{width:22px;height:22px}
  .scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
  .sess{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
  .toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}
  .hidden{display:none !important}
  .setup h1{font-size:26px;margin:8px 0 4px;letter-spacing:-.02em}

</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="progress-dock hidden" id="dock">
  <div class="in">

<script>
/* =========================================================
   SOVT 발성 훈련 — 6개월 플랜 + START 한 번으로 끝나는 자동 루틴
   기록은 이 기기 브라우저(localStorage)에만 저장
   ========================================================= */
const KEY = 'sovt-log-v1';

// ---------- 날짜 유틸 ----------
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diff = (a,b) => Math.round((parse(b)-parse(a))/864e5);   // b - a (일)
const WD = ['일','월','화','수','목','금','토'];
const md = s => { const d=parse(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const wd = s => WD[parse(s).getDay()];
const today = () => ymd(new Date());
const mmss = s => `${Math.floor(s/60)}:${pad(Math.max(0,s)%60)}`;
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- 저장소 ----------
const _start0 = addDays(today(), 1);
const COURSE_DAYS = 30;   // 강의 1~30강 = 1일차~30일차
const DEFAULTS = {
  startDate:_start0, endDate:addDays(_start0,COURSE_DAYS-1),
  rest:15, phraseSec:6, beep:true, pitch:true, guideSound:'auto', setupDone:false, logs:{}, best:0
};
let S;
function load(){
  try{ const raw=localStorage.getItem(KEY); S = raw ? {...DEFAULTS, ...JSON.parse(raw)} : {...DEFAULTS}; }
  catch(e){ S={...DEFAULTS}; }
  if(!S.logs || typeof S.logs!=='object') S.logs={};
  if(S.v6 && S.startDate && diff(S.startDate,S.endDate)!==COURSE_DAYS-1) S.endDate=addDays(S.startDate,COURSE_DAYS-1);
  if(!S.v6){ // 30일 플랜으로 개편: 이전 플랜 설정은 버리고 시작일만 다시 확인
    ['targetDate','voice','lower','inhale','exhale','bpm','planV','v3','v4','v5'].forEach(k=>delete S[k]);
    S.endDate=addDays(S.startDate,COURSE_DAYS-1); S.setupDone=false; S.v6=true;
  }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('저장 실패: 브라우저 저장 공간을 확인해 주세요'); } }

// ---------- 4개 파트 (30일 플랜) ----------
const PARTS = {
  1:{name:'몸 만들기 · 호흡 압력', desc:'횡격막·하복부 힘, 호흡길 따기, 호흡 방향', from:1, to:7},
  2:{name:'목열기', desc:'횡격막 하강으로 목 공간 열기', from:8, to:12},
  3:{name:'성대 늘리기', desc:'뒤에서 위로 늘리기, 접촉량, 가성→진성', from:13, to:20},
  4:{name:'성구전환 · 응용', desc:'접촉 이동, 층 나누기, 비브라토, 워밍업, 믹스보이스, 최종 음역 측정', from:21, to:30}
};
const dayNo = date => diff(S.startDate,date)+1;
const lessonOf = date => Math.max(1, Math.min(COURSE_DAYS, dayNo(date)));
function phaseOf(date){ if(dayNo(date)<1) return 0; const n=lessonOf(date); return n<=7?1:n<=12?2:n<=20?3:4; }
function phaseRange(p){ return [addDays(S.startDate,PARTS[p].from-1), addDays(S.startDate,PARTS[p].to-1)]; }
const weekOf = date => Math.floor(diff(S.startDate,date)/7)+1;
const totalWeeks = () => Math.ceil(COURSE_DAYS/7);

// ---------- 음 높이 ----------
// 음 이름은 과학적 표기(A4=440Hz). 한국식 "2옥타브 라" = A4, "3옥타브 도" = C5
const SEMI = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const SOL = {C:'도',D:'레',E:'미',F:'파',G:'솔',A:'라',B:'시'};
const midiOf = n => (Number(n.slice(-1))+1)*12 + SEMI[n[0]];
const hz = midi => 440*Math.pow(2,(midi-69)/12);
const koName = n => `${Number(n.slice(-1))-2}옥타브 ${SOL[n[0]]}`;
const koMidi = m => { const names=['C','C','D','D','E','F','F','G','G','A','A','B']; const nm=names[m%12]+(Math.floor(m/12)-1); return koName(nm)+([1,3,6,8,10].includes(m%12)?'#':''); };
// ---------- 30일 플랜 (1~30강) ----------
// 3강 이후에는 '성대 접촉 훈련'과 '횡격막 하강 훈련'이 매일 기본(강의: 어떤 진도를 나가든 매일 유지).
// 그 위에 그날 강의의 연습이 붙는다. 강의에 횟수가 없는 곳은 stage.note 로 표시.
const it = (cue, sub, dur, vis) => ({cue, sub, dur, vis});
const seq = (n, items, step) => ({t:'seq', n, items, step});
const phr = (pat, step, sub, vis) => ({t:'phr', pat, step, sub, vis});
const timed = (dur, cue, sub, vis, step) => ({t:'timed', dur, cue, sub, vis, step});
const measure = (cue, sub, step) => ({t:'measure', cue, sub, step});
const SONG_PREP = '레슨곡 후렴(MR)을 내 키로 준비해요. 후렴은 4소절로 나눠 진행해요';
const NOCNT = '횟수는 강의에 명시되지 않아 앱에서 정한 값이에요';

function r6def(dia){
  const d = dia ? ' · 횡격막 하강 먼저' : '';
  return { name: dia ? '5단계 루틴 + 횡격막 하강' : '호흡 안정화 5단계 루틴', sub:'① 접촉 20 → ② 호흡길 → ③ 교차 → ④ 반대 교차 → ⑤ 소리', tag:dia?'12강':'6강', sets:5, prep:SONG_PREP,
    blocks:[ seq(20,[it('성대 접촉','횡격막·하복부에 손'+d+' · 최대 강도',2500,'contact')],'① 접촉 20회'),
      phr('BBBB','② 후렴 호흡길'+d),
      phr('BSBS','③ 소절 교차'+d,'호흡길 때와 소리 때 힘·호흡 세기에 갭이 없게'),
      phr('SBSB','④ 반대 교차'+d,'호흡길 때와 소리 때 힘·호흡 세기에 갭이 없게'),
      phr('SSSS','⑤ 후렴 전체 소리'+d,'호흡길 때의 세기 그대로') ] };
}
function pos11(){
  const sub='같은 음정 · 같은 소절 · 소리가 얇아지는지 확인 · 몸의 힘은 풀지 않기';
  return { name:'호흡 위치 3단계', sub:'광대를 올려 호흡 위치 낮음 → 중간 → 높음', tag:'11강', sets:1, prep:SONG_PREP,
    blocks:[ timed(30,'횡격막 끝까지 내리고 뒤에서 위로 호흡','호흡이 아래쪽 위치에 있다고 이미지','breath'),
      phr('SSSS','① 낮은 위치',sub), phr('SSSS','② 중간 · 광대를 조금 올려',sub), phr('SSSS','③ 높은 위치 · 광대를 더 올려',sub) ] };
}
const STG = {
  orient1: () => ({ name:'오리엔테이션 · 키 설정', sub:'레슨곡 후렴 키 정하기', tag:'1강', sets:1, prep:'레슨곡(±5키 MR)을 준비해요',
    blocks:[ timed(180,'레슨곡을 원키로 불러 보기','너무 높으면 한 키씩 낮추고, 너무 낮으면 한 키씩 올려 막히는 곳까지 · 원키부터 이어서 한 번에','sing') ] }),
  orient2: () => ({ name:'2강 · 원칙 확인', sub:'생각보다 더 세게 · 더 내리고 · 더 힘주기', tag:'2강', sets:1, prep:'오늘은 연습 없이 원칙을 확인하는 날이에요',
    blocks:[ timed(60,'생각한 것보다 훨씬 세게, 더 내리고, 더 힘주기','소리가 안 나는 가장 흔한 이유는 횡격막·하복부의 힘이 모자란 것 (2강)','contact') ] }),
  contact: () => ({ name:'성대 접촉 훈련', sub:'횡격막 50 · 하복부 50 · 동시 50 (하루 300회 이상)', tag:'3강 · 매일', sets:1, prep:'허리를 곧게 펴요. 손가락을 명치에 대고 시작해요',
    blocks:[ seq(50,[it('횡격막 성대 접촉','명치에 손가락 · "허 어" · 최대 강도',2500,'contact')],'횡격막'),
      seq(50,[it('하복부 성대 접촉','하복부에 손 · "허 어" · 최대 강도',2500,'contact')],'하복부'),
      seq(50,[it('횡격막 + 하복부 동시','두 곳 모두 · 최대 강도',2500,'contact')],'동시') ] }),
  down: () => ({ name:'횡격막 하강 훈련', sub:'명치를 끝까지 내밀며 마시기 30회 × 3세트 (하루 150회 이상)', tag:'3강 · 매일', sets:3, prep:'허리를 곧게 펴고 가슴을 들어요',
    blocks:[ seq(30,[it('명치 끝까지 내밀며 마시기','풍선이 터질 만큼 강하게 끝까지 · 가슴을 들고 등은 활처럼',5000,'down')],'횡격막 하강') ] }),
  cross: () => ({ name:'접촉·호흡 교차', sub:'성대 접촉 2회 ↔ 입술 말아 호흡 2회 × 30', tag:'4·5강', sets:1, prep:'입술을 안으로 말아 다물 준비. 손은 횡격막과 하복부에',
    blocks:[ seq(30,[it('성대 접촉 ×2','횡격막·하복부에 손 · 최대 강도',4000,'contact'), it('호흡 뱉기 ×2','입술을 안으로 말아 다물고 압력 만들기 · 같은 근육의 감각',4000,'breath')],'교차') ] }),
  bp4: () => ({ name:'호흡길 따기', sub:'후렴 멜로디에 맞춰 호흡만 · 5세트', tag:'4강', sets:5, prep:SONG_PREP,
    blocks:[ phr('BBBB','후렴 호흡길') ] }),
  app4: () => ({ name:'호흡길 → 소리 적용', sub:'앞 소절은 호흡길, 뒤 소절은 소리 · 호흡 세기 100% 일치', tag:'4강', sets:3, prep:SONG_PREP, note:NOCNT,
    blocks:[ phr('BBSS','','호흡길 때의 호흡 세기·힘을 그대로 이어서') ] }),
  bp5: () => ({ name:'후렴 호흡길 ↔ 소리 교차', sub:'호흡길 한 소절, 소리 한 소절 · 3세트 이상', tag:'5강', sets:3, prep:SONG_PREP,
    blocks:[ phr('BSBS','','호흡길 때의 몸 움직임·힘·근수축과 100% 일치') ] }),
  r6: () => r6def(false),
  r6d: () => r6def(true),
  dir7: () => ({ name:'호흡 방향 뒤 → 위', sub:'횡격막·하복부 힘으로 연구개 쪽으로 30회', tag:'7강', sets:1, prep:'손은 횡격막과 하복부에',
    blocks:[ seq(30,[it('뒤에서 위로 호흡','횡격막·하복부 힘으로 연구개 방향 · 더 뒤쪽으로 쳐도 OK · 편한 방향',3000,'breath')],'호흡 방향') ] }),
  dir7s: () => ({ name:'호흡 방향 소리 적용', sub:'후렴을 뒤→위 호흡으로 · 편하면 키를 올리고 힘도 더', tag:'7강', sets:3, prep:SONG_PREP, note:NOCNT,
    blocks:[ phr('SSSS','','한 손은 횡격막 · 호흡을 뒤→위로 유도하며 · 음이 올라간 만큼 힘을 더 세게') ] }),
  down8: () => ({ name:'횡격막 하강 확인', sub:'숨 마시며 명치 끝까지 내밀기 20회', tag:'8강', sets:1, prep:'허리를 곧게. 명치를 앞으로 내밀 준비',
    blocks:[ seq(20,[it('숨 마시며 명치 끝까지 내밀기','더 내밀 명치도, 더 마실 숨도 없을 때까지',6000,'down')],'하강 확인') ] }),
  snd8: () => ({ name:'하강 소리 비교', sub:'하강 없이 vs 최대로 내리고 · 소리 차이 듣기', tag:'8강', sets:1, prep:SONG_PREP,
    blocks:[ phr('SSSS','① 하강 없이 (비교용)','횡격막·하복부 힘은 그대로'), phr('SSSS','② 명치 내밀고 숨 많이 마신 뒤 · 뒷공간 최대로','생각보다 최대한 많이 내리고 뒷공간을 열어서') ] }),
  block9: () => ({ name:'호흡 차단 (고강도 목열기)', sub:'횡격막 힘으로 새는 공기 줄이기 · 하복부만과 비교', tag:'9강', sets:1, prep:SONG_PREP,
    blocks:[ phr('SSSS','① 횡격막 충분히 내리고 소리','공기가 입 밖으로 빠지는 것을 느끼기'),
      phr('SSSS','② 횡격막 힘의 비율을 높여서','공기가 안으로 맴돌고 입 밖 공기가 줄어들고 목이 넓어지는 느낌'),
      phr('SSSS','③ 비교: 횡격막 내리고 하복부 힘만','소리가 더 좁고 앞에서 나고 공기가 더 새는지 확인'),
      phr('SSSS','④ 횡격막 + 하복부 둘 다 강하게') ] }),
  lvl10: () => ({ name:'하강 정도 3단계', sub:'적게 · 중간 · 많이 → 가장 편한 정도 찾기', tag:'10강', sets:1, prep:SONG_PREP,
    blocks:[ timed(30,'횡격막 하복부 힘으로 뒤에서 위로 호흡 치기','공간을 최대한 넓혔는지 먼저 체크','breath'),
      phr('SSSS','① 하강 적게'), phr('SSSS','② 하강 중간'), phr('SSSS','③ 하강 많이') ] }),
  pos11: () => pos11(),
  st13: () => ({ name:'성대 늘리기 기본', sub:'가성 "하~" · 횡격막 내리고 → 가벼운 접촉 → 뒤에서 위로', tag:'13강', sets:1, prep:'횡격막을 끝까지 내리고 시작해요', note:NOCNT,
    blocks:[ seq(10,[it('가성 "하~" 뒤에서 위로 늘리기','횡격막 내리고 → 가벼운 접촉 → 뒤에서 위로 궤도 넓게',6000,'stretch')],'성대 늘리기') ] }),
  st14: () => ({ name:'성대 늘리기 + 몸의 힘', sub:'힘 없이 vs 힘 세게 · 끝까지 유지하며 20회', tag:'14강', sets:1, prep:'횡격막을 끝까지 내리고 시작해요',
    blocks:[ timed(40,'비교: 하복부 힘을 일부러 빼고 늘리기','후두가 딸려 올라가 목이 막히고 늘어나지 않는 것을 확인','stretch'),
      seq(20,[it('횡격막·하복부 힘 강하게 · 끝까지 늘리기','늘리는 내내 힘을 세게, 늘릴수록 점점 더 · 끝에서 한 번 더 쥐어짜듯',6000,'stretch')],'성대 늘리기') ] }),
  st15: () => ({ name:'3요소 통합 동작', sub:'① 내리기 ② 힘 ③ 늘리기 · 30회', tag:'15강', sets:1, prep:'가성 "하~"로 해요. 처음엔 천천히 정확하게',
    blocks:[ seq(30,[it('① 횡격막 내리기 ② 힘 ③ 뒤에서 위로 늘리기','한 동작 · 처음엔 천천히 · 익숙해지면 연속으로 빠르게',5000,'stretch')],'통합 동작') ] }),
  meas16: () => ({ name:'가성 최고음 측정', sub:'매일 직전 기록 +반음에 도전', tag:'16강', sets:3, prep:'횡격막 내리고 가성 늘리기로 끝까지. 마이크가 켜져 있으면 최고음이 자동으로 기록돼요', note:NOCNT,
    blocks:[ measure('가성길로 끝까지 · 최고음 측정','횡격막 내리고 → 힘 → 뒤에서 위로 · 직전 기록 + 반음이 목표') ] }),
  song17: () => ({ name:'성대 늘리기 노래 적용', sub:'상행할 때만 뒤→위로 늘리기 · 글자 → 소절', tag:'17강', sets:1, prep:SONG_PREP,
    blocks:[ phr('SSSS','① 한 글자씩 끊어 늘리기','시작은 진성 · 중간에 뒤집혀도 OK · 올라갈 때만 뒤에서 위로'),

  8:['down8','snd8'], 9:['block9'], 10:['lvl10'], 11:['pos11'], 12:['r6d','pos11'],

function buildRoutine(date){
  const n = lessonOf(date);
  const ids = [...(n>=3 ? ['contact','down'] : []), ...LESSON_PLAN[n]];
  const stages = ids.map((id,i)=>({ id, no:String(i+1), ...STG[id]() }));

// 루틴을 시간 구간(segment) 목록으로 펼침 → 진행률·자동 전환에 사용
function flatten(routine){
  const segs=[]; const restMs=S.rest*1000; const phMs=S.phraseSec*1000;
  routine.stages.forEach((st,si)=>{
    segs.push({si, type:'prep', dur:6000, cue:'준비', sub:st.prep});
    for(let set=1; set<=st.sets; set++){
      st.blocks.forEach(b=>{
        if(b.t==='seq'){
          for(let i=1;i<=b.n;i++) b.items.forEach(x=>segs.push({si,set,type:'rep',dur:x.dur,cue:x.cue,sub:x.sub,vis:x.vis,label:`${b.step?b.step+' · ':''}${i}/${b.n}회`}));
        } else if(b.t==='phr'){
          [...b.pat].forEach((c,i)=>segs.push({si,set,type:'phr',dur:phMs,vis:c==='B'?'breath':(b.vis||'sing'),
            cue:c==='B'?'호흡길 따기':'소리로',
            sub:`${b.step?b.step+' · ':''}${c==='B'?'입술을 말아 하복부로 · 소절의 음높이에 맞춰 호흡만':(b.sub||'호흡길의 세기·힘 그대로 소리로')}`,
            count:true,label:`소절 ${i+1}/${b.pat.length}`}));
        } else if(b.t==='timed'){
          segs.push({si,set,type:'timed',dur:b.dur*1000,vis:b.vis,cue:b.cue,sub:b.sub,count:true,label:b.step||''});
        } else if(b.t==='measure'){
          segs.push({si,set,type:'measure',dur:12000,vis:'stretch',cue:b.cue||'가성길로 끝까지',sub:b.sub||'횡격막 내리고 → 힘 → 뒤에서 위로',count:true,label:b.step||''});
        }
      });
      if(set<st.sets) segs.push({si,set,type:'rest',dur:restMs,cue:'휴식',sub:'숨 고르기'});
    }
  });
  let acc=0; segs.forEach(s=>{ s.at=acc; acc+=s.dur; });
  return { segs, total:acc };
}

function sess(date, slot, create){
  if(!S.logs[date]){ if(!create) return null; S.logs[date]={}; }
  if(!S.logs[date][slot]){ if(!create) return null; S.logs[date][slot]={done:false,progress:0,secs:0,mood:0,memo:''}; }
  return S.logs[date][slot];
}
function status(s){ if(!s) return ''; if(s.done) return 'f'; if((s.progress||0)>0 || (s.sets||[]).some(x=>x>0)) return 'p'; return ''; }

// ---------- 오디오 (가이드음·알림음) ----------
let actx=null, segOut=null, metroIv=null;
function ac(){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){ actx=null; }
  return actx;
}
function out(){ // 현재 구간 전용 출력 → 건너뛸 때 한 번에 끊기
  const a=ac(); if(!a) return null;
  if(!segOut){ segOut=a.createGain(); segOut.connect(a.destination); }
  return segOut;
}
function cutAudio(){ try{ segOut && segOut.disconnect(); }catch(e){} segOut=null; }
function tone(freq, t0, dur, vol=0.18, type='triangle', dest){
  const a=ac(); if(!a) return; dest = dest || a.destination;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(dest);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.03);
  g.gain.exponentialRampToValueAtTime(vol*0.5,t0+dur*0.6); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.start(t0); o.stop(t0+dur+0.05);
}
function beep(freq=880, dur=0.15){ if(!S.beep) return; const a=ac(); if(a) tone(freq, a.currentTime, dur, 0.2, 'sine'); }
function piano(freq, t0, dur, dest){ tone(freq,t0,dur,0.16,'triangle',dest); tone(freq*2,t0,dur*0.6,0.04,'sine',dest); }
function sirenSound(lo, hi, dur){
  const a=ac(), d=out(); if(!a||!d) return;
  const t=a.currentTime, o=a.createOscillator(), g=a.createGain();
  o.type='sine'; o.connect(g); g.connect(d);
  o.frequency.setValueAtTime(lo,t); o.frequency.exponentialRampToValueAtTime(hi,t+dur/2); o.frequency.exponentialRampToValueAtTime(lo,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.12,t+0.2); g.gain.setValueAtTime(0.12,t+dur-0.2); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t); o.stop(t+dur+0.05);
}
function scaleSound(base, steps, stepMs){
  const a=ac(), d=out(); if(!a||!d) return;
  const t=a.currentTime, s=stepMs/1000; steps.forEach((st,i)=>piano(base*Math.pow(2,st/12), t+i*s, s*0.8, d));
}
function fanfare(){ const a=ac(); if(!a) return; const t=a.currentTime; [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*0.14,i===3?0.6:0.18,0.2,'triangle')); }
function metroToggle(force){
  const on = force!==undefined ? force : !metroIv;
  clearInterval(metroIv); metroIv=null;
  if(on){ const a=ac(); if(!a) return; const ms=60000/(S.bpm||110); let n=0;
    metroIv=setInterval(()=>{ if(P && !P.paused){ tone(n%4===0?1500:1000, a.currentTime, 0.04, 0.12, 'square'); n++; } }, ms); }
  const b=document.getElementById('metroBtn'); if(b) b.textContent = metroIv ? `메트로놈 끄기 (${S.bpm} BPM)` : `메트로놈 켜기 (${S.bpm} BPM)`;
}

function samplePitch(g, e){
  const f=detectPitch(); const m = f>0 ? toMidi(f) : null;
  P.trace.push({t:e/g.dur, m});
  const gm=guideMidi(g,e), tol = g.type==='siren' ? 1.0 : 0.5;   // 반음 단위 허용 오차
  const out=document.getElementById('pnow');
  if(m!=null && gm!=null){
    P.voiced++; const diff=m-gm; if(Math.abs(diff)<=tol) P.hit++;
    if(out){ const c=Math.round(diff*100); const gap = Math.abs(c)>=100 ? `반음 ${Math.round(Math.abs(diff))}개` : `${Math.abs(c)}센트`; out.textContent = `${sciName(m)} · ${Math.abs(c)<=tol*100?'맞음':`${gap} ${c>0?'높음':'낮음'}`}`; out.style.color = Math.abs(diff)<=tol ? 'var(--ok)' : 'var(--sub)'; }
  } else if(out) out.textContent='소리를 기다리는 중';
  const acc=document.getElementById('pacc'); if(acc && P.voiced>4) acc.textContent=`정확도 ${Math.round(P.hit/P.voiced*100)}%`;
}

async function startRoutine(){
  const date=today(); const routine=buildRoutine(date); const {segs,total}=flatten(routine);
  ac(); // 사용자 터치로 오디오 시작 (모바일 필수)
  P = {routine, segs, total, i:-1, elapsedBefore:0, paused:false, date, slot, t0:Date.now(), trace:[], hit:0, voiced:0, accs:[]};
  const s=sess(date,slot,true); s.done=false;
  keepAwake(true); nextSeg();
  clearInterval(tickIv); tickIv=setInterval(tick, 50);
  if(S.pitch){ const ok=await startMic(); if(!ok && mic.err) toast(mic.err+' · 화면 가이드만 보여줘요'); if(P) render(); }
}
function curSeg(){ return P && P.segs[P.i]; }
function segElapsed(){ if(!P) return 0; return P.paused ? P.pausedAt - P.segStart : Date.now() - P.segStart; }
function nextSeg(){
  if(P.i>=0){
    const prev=curSeg();
    if(prev.count){ beep(1320,0.09); }
    if(prev.type==='measure' && P.maxM>0){ const m=Math.round(P.maxM); const s=sess(P.date,P.slot,true); s.best=Math.max(s.best||0,m); if(m>(S.best||0)){ S.best=m; toast('가성 최고음 갱신 '+koMidi(m)); } save(); }
    if(prev.type==='rest'){ beep(880,0.35); }
    if(pitchSeg(prev) && P.voiced>10) P.accs.push(P.hit/P.voiced);
  }
  enterSeg(P.i+1);
}
// 특정 구간으로 이동해서 시작 (다음·이전·건너뛰기 공용)
function enterSeg(idx){
  cutAudio();
  P.trace=[]; P.hit=0; P.voiced=0; P.lastBeep=null;
  P.i=Math.max(0,idx);
  if(P.i>=P.segs.length){ finishRoutine(); return; }
  const g=curSeg(); P.segStart=Date.now(); P.elapsedBefore=g.at;
  saveProgress();
  // 마이크를 쓸 때는 가이드음이 마이크에 섞이지 않게 들숨 때 미리 들려주고, 소리 낼 땐 화면만
  if(soundDuring()){
    if(g.type==='siren') sirenSound(hz(g.lo), hz(g.hi), g.dur/1000);
    if(g.type==='scale') scaleSound(hz(g.base), g.steps, g.step);
  }
  if(g.type==='measure') P.maxM=0;
  if(g.type==='bpbreath' || (g.type==='long' && soundDuring())){ const a=ac(), d=out(); if(a&&d) piano(hz(g.midi), a.currentTime+0.05, g.dur/1000, d); }   // 호흡 길은 소리가 아니라 측정 안 하므로 항상 들려줌
  if(g.type==='inhale' && g.preview!==undefined){ const a=ac(), d=out(); if(a&&d) piano(hz(g.preview), a.currentTime+0.2, g.hold?2.2:1.2, d); }
  if(g.type==='prep' && g.dur) beep(660,0.12);
  if(g.type!=='free' && metroIv) metroToggle(false);
  render();
}
// 뒤로: 2초 이상 진행했으면 이번 회차를 처음부터(들숨부터), 막 시작했으면 바로 앞 구간으로
function goBack(){
  if(!P) return; if(P.paused) togglePause();
  const g=curSeg(), e=segElapsed();
  let to = P.i;
  if(e<2000) to = P.i-1;
  const t=P.segs[to];
  if(t && t.count && to>0 && P.segs[to-1].type==='inhale' && P.segs[to-1].rep===t.rep && P.segs[to-1].si===t.si) to--;
  enterSeg(Math.max(0,to));
}
// 이 구간만 건너뛰기 (휴식·준비·타이머 등)
function skipSeg(){ if(!P) return; if(P.paused) togglePause(); nextSeg(); }
function tick(){
  if(!P || P.paused) return;
  const g=curSeg(); if(!g) return;
  const e=segElapsed();
  if(g.type==='rest'||g.type==='prep'||g.type==='recover'||g.type==='vac'){
    const left=Math.ceil((g.dur-e)/1000);
    if(left<=3 && left>0 && left!==P.lastBeep){ P.lastBeep=left; beep(660,0.1); }
  }
  if(e>=g.dur){ P.lastBeep=null; nextSeg(); return; }
  if(pitchSeg(g)){ samplePitch(g,e); drawPitch(g,e); }
  if(g.type==='measure' && mic.on){ const f=detectPitch(); if(f>0){ const m=toMidi(f); if(m>(P.maxM||0)) P.maxM=m; } const mx=document.getElementById('mx'); if(mx) mx.textContent=P.maxM?`${koMidi(Math.round(P.maxM))} (${sciName(P.maxM)})`:'소리를 기다리는 중'; }
  paintTick(g,e);
}
function paintTick(g,e){
  const left=Math.max(0,Math.ceil((g.dur-e)/1000));
  const el=id=>document.getElementById(id);
  if(el('tleft')) el('tleft').textContent = g.type==='free' ? mmss(left) : left;
  const bf=el('bodyNow'); if(bf) setBody(bf, bodyState(g, e, P.routine.stages[g.si]));
  if(g.type==='siren' && el('dot')){
    const p=e/g.dur, x=20+p*280, y=170-130*Math.sin(Math.PI*p);
    el('dot').setAttribute('cx',x); el('dot').setAttribute('cy',y);
  }
  if(g.type==='long' && el('lfill')) el('lfill').style.width=`${Math.min(100,e/g.dur*100)}%`;
  if(g.type==='scale'){
    const k=Math.min(g.steps.length-1,Math.floor(e/g.step));
    document.querySelectorAll('.stairs i').forEach((b,i)=>{ b.className = i===k?'on': i<k?'past':''; });
  }
  const done=P.elapsedBefore+e, pct=Math.min(100,done/P.total*100);
  if(el('dockBar')) el('dockBar').style.width=pct+'%';
  if(el('dockTime')) el('dockTime').textContent=`${Math.round(pct)}% · 남은 ${mmss(Math.ceil((P.total-done)/1000))}`;
}
function togglePause(){
  if(!P) return;
  if(!P.paused){ P.paused=true; P.pausedAt=Date.now(); try{actx&&actx.suspend();}catch(e){} keepAwake(false); }
  else { P.segStart += Date.now()-P.pausedAt; P.paused=false; try{actx&&actx.resume();}catch(e){} keepAwake(true); }
  render();
}
function skipStage(){
  if(!P) return; const si=curSeg().si;
  let j=P.i; while(j<P.segs.length && P.segs[j].si===si) j++;
  if(P.paused) togglePause();
  P.i=j-1; const last=P.segs[j-1]; P.segStart=Date.now()-last.dur;
  nextSeg();
}
function pitchAvg(){ return P && P.accs.length ? Math.round(P.accs.reduce((a,b)=>a+b,0)/P.accs.length*100) : null; }
function saveProgress(){
  if(!P) return; const s=sess(P.date,P.slot,true);
  const g=curSeg(); const done = g ? g.at : P.total;
  s.progress=Math.max(s.progress||0, Math.round(done/P.total*100)/100);
  s.secs=Math.max(s.secs||0, Math.round((Date.now()-P.t0)/1000));
  const pa=pitchAvg(); if(pa!=null) s.pitch=pa;
  save();
}
function stopRoutine(){
  if(!P) return; saveProgress(); cutAudio(); metroToggle(false); clearInterval(tickIv); stopMic();
  P=null; keepAwake(false); render(); toast('여기까지 기록했어요');
}
function finishRoutine(){
  const s=sess(P.date,P.slot,true);
  s.done=true; s.progress=1; s.secs=Math.round((Date.now()-P.t0)/1000); s.finishedAt=Date.now();
  const pa=pitchAvg(); if(pa!=null) s.pitch=pa;
  save(); cutAudio(); metroToggle(false); clearInterval(tickIv); stopMic();
  P=null; keepAwake(false); fanfare(); try{navigator.vibrate&&navigator.vibrate([60,80,60,80,160]);}catch(e){}
  render(); window.scrollTo(0,0);
}

function header(){

  const big = n<1 ? `D-${1-n}` : `${n}일차`;
  const sub = n<1 ? `${md(t)} (${wd(t)}) · 시작 ${md(S.startDate)}` : `${md(t)} (${wd(t)}) · ${L}일차 루틴`;
  const badge = ph===0 ? `시작 ${md(S.startDate)}` : n>COURSE_DAYS ? '30강 이후 · 매일 유지' : `${ph}파트 · ${PARTS[ph].name}`;
  return `<header class="top"><div><div class="dday">${big}</div><div class="dsub">${esc(sub)}</div></div><span class="badge">${esc(badge)}</span></header>`;

function renderToday(){

  if(P) return header()+renderPlayer();
  const routine=buildRoutine(t), {total}=flatten(routine), L=routine.lesson;
  const am=status(sess(t,'am')), pm=status(sess(t,'pm'));
  const lab=x=>x==='f'?'완료':x==='p'?'하다 멈춤':'대기';
  const s=sess(t,slot,false);
  const secs=routine.stages.map(st=>flatten({stages:[st]}).total/1000);
  const stages=routine.stages.map((st,i)=>`<li><span class="n ${s?.done?'ok':''}">${st.no}</span><div class="t"><b>${esc(st.name)}</b><span class="muted">${esc(st.sub)}</span>${tags(st)}${st.note?`<span class="muted" style="display:block;font-size:11px">※ ${esc(st.note)}</span>`:''}</div><span class="muted mins">${Math.round(secs[i]/60*10)/10}분</span></li>`).join('');

    </section>

      <h3>오늘 느낌 남기기</h3>
      <div class="field"><span>컨디션</span><div class="chips">${[1,2,3,4,5].map(n=>`<button class="chip ${s.mood===n?'on':''}" data-act="mood" data-v="${n}">${n}</button>`).join('')}</div></div>
      <label class="field"><span>한 줄 메모</span><input type="text" data-act="memo" value="${esc(s.memo||'')}" placeholder="예: 끝에서 접촉이 빠짐, 횡격막이 덜 내려감"></label>

    </section>` : `

      <div class="row"><h3>${L}일차 루틴</h3><span class="muted">약 ${Math.round(total/60000)}분</span></div>
      ${timeline}

      ${S.best?`<p class="muted" style="margin:10px 0 0">가성 최고음 기록 ${koMidi(S.best)} · 다음 목표 ${koMidi(S.best+1)}</p>`:''}
      <div class="actions"><button class="btn primary big" data-act="start">START</button></div>

function renderPlayer(){
  const g=curSeg(); const st=P.routine.stages[g.si]; const n=P.routine.stages.length;
  const resting = g.type==='rest';
  const sec = Math.ceil(g.dur/1000);
  const fig = bodyFig('bodyNow', {tool:st.tool, label:st.name});
  const side = right => `<div class="viz2"><div class="figbox sm">${fig}</div><div class="vright">${right}</div></div>`;
  let viz='';
  if(g.type==='prep') viz=`<div class="prepbox"><div class="bigtime" id="tleft">${sec}</div><div class="prep-tags">${tags(st)}</div></div>`;
  else if(resting) viz=`<div style="text-align:center"><div class="bigtime" id="tleft">${S.rest}</div><div style="margin-top:6px">다음: ${g.set+1}세트</div></div>`;
  else if(g.type==='measure') viz=side(`<div style="text-align:center"><div class="muted" style="font-size:12px">${S.best?`지금까지 최고 ${koMidi(S.best)} · 목표 ${koMidi(S.best+1)}`:'처음 기록을 세워요'}</div><div id="mx" style="font-size:22px;font-weight:700;color:var(--accent);margin:12px 0">${mic.on?'소리를 기다리는 중':'마이크 꺼짐 · 직접 확인'}</div><div class="muted"><span id="tleft">${sec}</span>초</div></div>`);
  else if(pitchSeg(g)) viz=side(`<canvas id="pcv" style="width:100%;height:210px;display:block;background:var(--bg);border-radius:12px"></canvas>
      <div class="row" style="margin-top:6px;font-size:12px"><span id="pnow" class="muted">소리를 기다리는 중</span><span id="pacc" class="muted"></span></div>`);
  else if(g.type==='siren') viz=side(`<svg viewBox="0 0 320 190" width="100%" height="180" aria-hidden="true"><path d="M20 170 Q 160 -90 300 170" fill="none" stroke="var(--tint2)" stroke-width="6" stroke-linecap="round"/><text x="160" y="16" text-anchor="middle" font-size="15" font-weight="600" fill="var(--sub)">${koMidi(g.hi)}</text><circle id="dot" cx="20" cy="170" r="12" fill="var(--accent)"/></svg>`);
  else if(g.type==='scale') viz=side(`<div class="stairs" aria-hidden="true">${g.steps.map(v=>`<i style="height:${28+v*17}px"></i>`).join('')}</div>`);
  else if(g.type==='long') viz=side(`<div style="text-align:center"><div style="font-size:16px;font-weight:700;color:var(--accent);margin-bottom:14px">${koMidi(g.midi)}</div><div class="bar" style="height:14px;border-radius:7px"><i id="lfill" style="transition:none"></i></div><div class="muted" style="margin-top:10px"><span id="tleft">${sec}</span>초</div></div>`);
  else if(g.type==='free') viz=side(`<div style="text-align:center"><div class="bigtime" id="tleft" style="font-size:52px">${mmss(st.min*60)}</div><div class="muted" style="margin-top:8px">입 막고 한 소절씩</div></div>`);
  else viz=`<div class="figbox lg">${fig}<div class="figtime" id="tleft">${sec}</div></div>`;
  const counts = g.type==='prep' ? '' :
    `<div class="count"><span>${esc(g.label||'')}</span>${st.sets>1&&g.set?`<span>${g.set}/${st.sets}세트</span>`:''}</div>`;

      <div class="ctrl">

        <button class="btn" data-act="skipseg" aria-label="이 구간 건너뛰기">${resting?'휴식 건너뛰기':'건너뛰기'} ▶</button>

function renderRecord(){
  const t=today(), tw=totalWeeks();
  const curW=Math.min(Math.max(weekOf(t),1),tw), wStart=addDays(S.startDate,(curW-1)*7);
  let wDone=0; for(let i=0;i<7;i++){ const d=addDays(wStart,i); ['am','pm'].forEach(k=>{ if(sess(d,k)?.done) wDone++; }); }
  let totalSess=0, totalSecs=0;
  Object.values(S.logs).forEach(day=>['am','pm'].forEach(k=>{ const s=day[k]; if(s){ if(s.done) totalSess++; totalSecs+=s.secs||0; } }));
  let streak=0, d=t; const dayDone=x=>sess(x,'am')?.done||sess(x,'pm')?.done;
  if(!dayDone(d)) d=addDays(d,-1); while(dayDone(d)){ streak++; d=addDays(d,-1); }

  let head='<div></div>', amRow='<div class="lbl">아침</div>', pmRow='<div class="lbl">저녁</div>';
  for(let i=0;i<7;i++){ const x=addDays(wStart,i);
    head+=`<div class="muted" style="font-size:11px">${wd(x)}<br>${md(x)}</div>`;
    const a=status(sess(x,'am')), p=status(sess(x,'pm'));
    amRow+=`<div class="c ${a}">${a==='f'?'✓':''}</div>`; pmRow+=`<div class="c ${p}">${p==='f'?'✓':''}</div>`; }

  let grid='<div></div>'+Array.from({length:7},(_,i)=>`<div class="h">${wd(addDays(S.startDate,i))}</div>`).join('');
  let lastPh=0;
  for(let w=1; w<=tw; w++){
    const ws=addDays(S.startDate,(w-1)*7), ph=Math.min(4,Math.max(1,phaseOf(ws)));
    if(ph!==lastPh){ grid+=`<div class="stageline">${ph}파트 · ${PARTS[ph].name}</div>`; lastPh=ph; }
    grid+=`<div class="wk"><b>${w}주</b>${md(ws)}</div>`;
    for(let i=0;i<7;i++){ const x=addDays(ws,i);
      if(diff(x,S.endDate)<0){ grid+='<div></div>'; continue; }
      grid+=`<button class="cell ${diff(t,x)>0?'future':''} ${x===t?'today':''}" data-act="day" data-d="${x}" aria-label="${md(x)} 기록"><span class="d">${parse(x).getDate()}</span><span class="h2 ${status(sess(x,'am'))}"></span><span class="h2 ${status(sess(x,'pm'))}"></span></button>`; }
  }
  return `
    <header class="top"><div><div class="dday" style="font-size:24px">기록</div><div class="dsub">${md(S.startDate)} ~ ${md(S.endDate)} · ${tw}주</div></div><span class="badge">${curW}주차</span></header>
    <div class="stats">
      <div class="stat"><b>${streak}</b><span>연속 일수</span></div>
      <div class="stat"><b>${totalSess}</b><span>완료 루틴</span></div>
      <div class="stat"><b>${Math.round(totalSecs/60)}</b><span>누적 분</span></div>
      <div class="stat"><b>${wDone}/14</b><span>이번 주</span></div>
    </div>
    <section class="card">
      <div class="row"><h3>이번 주 (${curW}주차)</h3><span class="muted">${wDone} / 14 루틴</span></div>
      <div class="bar" style="margin-top:10px"><i style="width:${wDone/14*100}%"></i></div>
      <div class="wtable">${head}${amRow}${pmRow}</div>
    </section>
    <section class="card">
      <div class="row"><h3>전체 ${tw}주</h3><span class="muted">칸을 누르면 상세</span></div>
      <div class="grid">${grid}</div>
      <div class="legend"><span><i style="background:var(--accent)"></i>완료</span><span><i style="background:var(--tint2)"></i>하다 멈춤</span><span><i style="background:var(--line)"></i>미기록</span><span class="muted">위칸 아침 · 아래칸 저녁</span></div>
    </section>`;
}
function renderSheet(){
  const old=document.getElementById('sheet'); if(old) old.remove(); if(!sheetDate) return;
  const x=sheetDate, ph=Math.min(4,Math.max(1,phaseOf(x)));
  const block=(k,label)=>{ const s=sess(x,k);
    return `<div class="sess"><div class="row"><b>${label}</b><span class="muted">${s?.done?'완료':s?.progress?`${Math.round(s.progress*100)}%에서 멈춤`:'기록 없음'}</span></div>
      ${s?.secs?`<div class="muted" style="margin-top:6px">훈련 ${mmss(s.secs)}${s.pitch!=null?` · 음정 ${s.pitch}%`:''}${s.mood?` · 컨디션 ${s.mood}/5`:''}</div>`:''}
      ${s?.memo?`<div style="margin-top:6px;font-size:14px">${esc(s.memo)}</div>`:''}
      <div class="actions" style="margin-top:10px">${s?.done?`<button class="btn" data-act="mark" data-k="${k}" data-v="0">미완료로 변경</button>`:`<button class="btn primary" data-act="mark" data-k="${k}" data-v="1">완료로 표시</button>`}</div></div>`; };
  const el=document.createElement('div'); el.className='scrim'; el.id='sheet';
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${md(x)} 기록">
    <div class="row"><div><b style="font-size:18px">${md(x)} (${wd(x)})</b><div class="muted">${dayNo(x)}일차 · ${ph}파트 ${PARTS[ph].name}</div></div>
    <button class="btn" style="flex:none" data-act="close">닫기</button></div>${block('am','아침')}${block('pm','저녁')}</div>`;
  document.body.appendChild(el);
}

// =================== 설정 ===================
function renderSettings(){
  const chip=(act,k,v,label,on)=>`<button class="chip ${on?'on':''}" data-act="${act}" data-k="${k}" data-v="${v}">${label}</button>`;
  return `
    <header class="top"><div><div class="dday" style="font-size:24px">설정</div><div class="dsub">기록은 이 기기에만 저장돼요</div></div></header>
    <section class="card"><h3>일정</h3>
      <label class="field"><span>시작일 (1일차 = 1강)</span><input type="date" data-set="startDate" value="${S.startDate}"></label>
      <p class="muted" style="margin:6px 0 0">30강은 ${md(S.endDate)}. 이후에는 기본 훈련을 이어가요.</p>
    </section>
    <section class="card"><h3>루틴</h3>
      <div class="field"><span>세트 사이 휴식</span><div class="chips">${[15,30,60].map(n=>chip('setn','rest',n,n+'초',S.rest===n)).join('')}</div></div>
      <div class="field"><span>소절 한 칸 길이 (후렴 4소절)</span><div class="chips">${[5,6,8,10].map(n=>chip('setn','phraseSec',n,n+'초',S.phraseSec===n)).join('')}</div></div>
      <div class="field"><span>알림음</span><div class="chips">${chip('setv','beep',S.beep?'0':'1',S.beep?'켜짐':'꺼짐',S.beep)}</div></div>
    </section>
    <section class="card"><h3>가성 최고음 측정 (마이크)</h3>
      <p class="muted" style="margin:6px 0 0;line-height:1.6">16·20·26강의 최고음 측정 구간에서 마이크로 가장 높은 음을 기록해요. 설치한 앱(HTTPS 주소)에서 마이크를 허용하면 작동해요.</p>
      <div class="field"><span>음정 측정</span><div class="chips">${chip('setv','pitch',S.pitch?'0':'1',S.pitch?'켜짐':'꺼짐',S.pitch)}</div></div>
      <div class="field"><span>현재 최고 기록</span><span>${S.best?koMidi(S.best):'없음'}</span></div>
    </section>
    <section class="card"><h3>백업</h3>
      <p class="muted" style="margin:6px 0 0">폰을 바꾸거나 브라우저 데이터를 지우면 기록이 사라져요. 주 1회 내보내기를 권해요.</p>
      <div class="actions"><button class="btn primary" data-act="export">내보내기</button><button class="btn" data-act="import">불러오기</button></div>
    </section>
    <section class="card"><h3>홈 화면에 추가</h3>
      <p class="muted" style="margin:6px 0 0;line-height:1.6">안드로이드 Chrome: 메뉴(⋮) → 앱 설치 / 홈 화면에 추가<br>아이폰 Safari: 공유 버튼 → 홈 화면에 추가</p></section>
    <section class="card"><h3>초기화</h3>
      <div class="actions"><button class="btn" data-act="resetup">처음 설정 다시 하기</button><button class="btn danger" data-act="reset">모든 기록 지우기</button></div></section>`;
}

// =================== 첫 화면 설정 ===================
let D=null;
function renderSetup(){
  if(!D) D={startDate:S.startDate};
  const keep=S; S={...S,...D,endDate:addDays(D.startDate,COURSE_DAYS-1)};  // 미리보기 계산용
  const road=[1,2,3,4].map(p=>{ const [a,b]=phaseRange(p); return `<div><span><b>${p}파트 · ${PARTS[p].name}</b> (${PARTS[p].from}~${PARTS[p].to}강)<br><span class="muted">${PARTS[p].desc}</span></span><span class="muted">${md(a)}~${md(b)}</span></div>`; }).join('');
  S=keep;
  return `<div class="setup">
    <h1>발성 훈련 시작하기</h1>
    <p class="muted" style="margin:0 0 16px">30일 플랜(1~30강)을 하루에 한 강씩 따라가요. 3강부터는 성대 접촉·횡격막 하강 훈련이 매일 기본이에요.</p>
    <section class="card">
      <label class="field" style="margin-top:0"><span>시작일 (1일차 = 1강)</span><input type="date" data-draft="startDate" value="${D.startDate}"></label>
    </section>
    <section class="card"><h3>4개 파트</h3>
      <div class="roadmap" style="margin-top:10px">${road}</div>
    </section>
    <button class="btn primary big" data-act="setup-start">이 일정으로 시작</button></div>`;
}
function finishSetup(){
  S={...S,startDate:D.startDate,endDate:addDays(D.startDate,COURSE_DAYS-1), setupDone:true, v6:true}; D=null; save(); tab='today'; render(); window.scrollTo(0,0); toast('30일 플랜을 만들었어요');
}

// =================== 렌더 & 이벤트 ===================
function render(){
  const setup=!S.setupDone;
  document.querySelector('nav.tabs').classList.toggle('hidden', setup);
  $app.innerHTML = setup ? renderSetup() : tab==='today' ? renderToday() : tab==='record' ? renderRecord() : renderSettings();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  // 하단 진행률: 루틴 탭에서 실행 중일 때 또는 실행 전 0%
  const dock=document.getElementById('dock');
  const showDock = !setup && (P || tab==='today');
  dock.classList.toggle('hidden', !showDock);
  if(P){ document.getElementById('dockLabel').textContent = `STAGE ${curSeg().si+1}/${P.routine.stages.length}${P.paused?' · 일시정지':''}`; paintTick(curSeg(), segElapsed()); }
  else if(showDock){ const s=sess(today(),slot,false); const pct=s?.done?100:Math.round((s?.progress||0)*100);
    document.getElementById('dockLabel').textContent=`${slot==='am'?'아침':'저녁'} 루틴 진행률`;
    document.getElementById('dockBar').style.width=pct+'%'; document.getElementById('dockTime').textContent=`${pct}%`; }
  renderSheet();
  if(!demoRaf && document.querySelector('svg.bf[data-demo]')) demoRaf=requestAnimationFrame(demoLoop);
}

document.querySelector('nav.tabs').addEventListener('click', e=>{
  const b=e.target.closest('button[data-tab]'); if(!b) return; tab=b.dataset.tab; sheetDate=null; render(); window.scrollTo(0,0);
});
document.addEventListener('click', e=>{
  if(e.target.id==='sheet'){ sheetDate=null; renderSheet(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, t=today();
  switch(act){
    case 'slot': if(P){ toast('루틴 진행 중에는 바꿀 수 없어요'); return; } slot=b.dataset.v; break;
    case 'start': startRoutine(); return;
    case 'pause': togglePause(); return;
    case 'skip': skipStage(); return;
    case 'skipseg': skipSeg(); return;
    case 'back': goBack(); return;
    case 'stop': stopRoutine(); return;
    case 'metro': metroToggle(); return;
    case 'mood': { const s=sess(t,slot,true); const v=+b.dataset.v; s.mood=s.mood===v?0:v; save(); break; }
    case 'day': sheetDate=b.dataset.d; renderSheet(); return;
    case 'close': sheetDate=null; renderSheet(); return;
    case 'mark': { const s=sess(sheetDate,b.dataset.k,true); s.done=b.dataset.v==='1'; if(s.done) s.progress=1; save(); render(); return; }
    case 'setn': S[b.dataset.k]=+b.dataset.v; save(); break;
    case 'setv': S[b.dataset.k] = (b.dataset.k==='beep'||b.dataset.k==='pitch') ? b.dataset.v==='1' : b.dataset.v; save(); if(b.dataset.k==='beep'&&S.beep) beep(); break;
    case 'draftv': if(D) D[b.dataset.k]=b.dataset.v; break;
    case 'setup-start': finishSetup(); return;
    case 'resetup': if(P) stopRoutine(); S.setupDone=false; save(); break;
    case 'export': exportData(); return;
    case 'import': document.getElementById('importFile').click(); return;
    case 'reset': if(confirm('모든 기록을 지울까요? 되돌릴 수 없어요.')){ if(P) stopRoutine(); S={...DEFAULTS,logs:{},v6:true}; save(); toast('초기화했어요'); } break;
    default: return;
  }
  render();
});
document.addEventListener('input', e=>{
  if(e.target.dataset.draft && D && e.target.type==='text'){ D[e.target.dataset.draft]=e.target.value; return; }
  if(e.target.dataset.act==='memo'){ const s=sess(today(),slot,true); s.memo=e.target.value.slice(0,200); save(); }
});
document.addEventListener('change', e=>{
  const dk=e.target.dataset.draft; if(dk && D){ D[dk]=e.target.value; if(e.target.type==='date') render(); return; }
  const k=e.target.dataset.set; if(!k) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) return;
  const next={...S,[k]:e.target.value};
  if(k==='startDate') next.endDate=addDays(next.startDate,COURSE_DAYS-1);
  S=next; save(); toast('일정을 바꿨어요'); render();
});

// ---------- 백업 ----------
function exportData(){
  if(window.self!==window.top){ showCopySheet(); return; }
  try{ const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}); const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=`발성훈련-기록-${today()}.json`; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); toast('기록 파일을 저장했어요'); }catch(err){ toast('내보내기에 실패했어요'); }
}
function showCopySheet(){
  const el=document.createElement('div'); el.className='scrim';
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="기록 백업"><div class="row"><b style="font-size:18px">기록 백업</b><button class="btn" style="flex:none" data-x="close">닫기</button></div>
    <p class="muted">아래 내용을 복사해 저장해 두세요.</p><textarea readonly style="min-height:200px;font-size:12px">${esc(JSON.stringify(S))}</textarea>
    <div class="actions"><button class="btn primary" data-x="copy">전체 복사</button></div></div>`;
  document.body.appendChild(el);
  el.addEventListener('click', async ev=>{ const x=ev.target.dataset.x;
    if(ev.target===el||x==='close'){ el.remove(); return; }
    if(x==='copy'){ const ta=el.querySelector('textarea'); try{ await navigator.clipboard.writeText(ta.value); toast('복사했어요'); }catch(err){ ta.select(); try{document.execCommand('copy'); toast('복사했어요');}catch(e2){ toast('길게 눌러 직접 복사해 주세요'); } } } });
}
document.getElementById('importFile').addEventListener('change', async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const d=JSON.parse(await f.text()); if(!d||typeof d.logs!=='object') throw 0; S={...DEFAULTS,...d}; save(); render(); toast('기록을 불러왔어요'); }
  catch(err){ toast('불러오기 실패: 올바른 기록 파일이 아니에요'); }
});

let lastDay=today();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && !P && today()!==lastDay){ lastDay=today(); render(); } });
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

load(); render();
</script>
</body>
</html>
