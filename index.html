<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>발성 훈련 기록</title>
<meta name="theme-color" content="#2f5bd3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="발성 훈련">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#15181e; --sub:#5b6270; --line:#e3e6eb;
    --accent:#2f5bd3; --accent-ink:#ffffff; --tint:#e8eefc; --tint2:#c9d6f6;
    --ok:#1f8a5b; --shadow:0 1px 2px rgba(20,24,30,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1115; --card:#181b21; --ink:#eef0f4; --sub:#a1a8b5; --line:#2a2f38;
      --accent:#7b9cff; --accent-ink:#0f1115; --tint:#1e2740; --tint2:#33467a; --ok:#5cc596; --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1115; --card:#181b21; --ink:#eef0f4; --sub:#a1a8b5; --line:#2a2f38;
    --accent:#7b9cff; --accent-ink:#0f1115; --tint:#1e2740; --tint2:#33467a; --ok:#5cc596; --shadow:none;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
    -webkit-tap-highlight-color:transparent;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
  button{font:inherit;color:inherit}
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px 24px}
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 0 16px}
  .dday{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .dsub{font-size:13px;color:var(--sub);margin-top:6px}
  .badge{display:inline-flex;align-items:center;background:var(--tint);color:var(--accent);font-weight:600;font-size:13px;padding:6px 10px;border-radius:999px;white-space:nowrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .card h3{margin:0;font-size:15px;font-weight:600}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .muted{color:var(--sub);font-size:13px}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
  .seg button{border:0;background:transparent;padding:10px 8px;border-radius:10px;font-weight:600;font-size:15px;cursor:pointer;min-height:44px}
  .seg button.on{background:var(--accent);color:var(--accent-ink)}
  .seg small{display:block;font-weight:500;font-size:12px;opacity:.8;margin-top:2px}
  .btn{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font-weight:600;font-size:14px;cursor:pointer;min-height:44px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.big{width:100%;min-height:60px;font-size:18px;letter-spacing:.02em}
  .btn.danger{color:#c0392b}
  .btn:disabled{opacity:.45}
  .actions{display:flex;gap:8px;margin-top:14px;width:100%}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px;min-width:44px;font-size:14px;cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .field{display:grid;gap:8px;margin-top:14px}
  .field > span{font-size:13px;color:var(--sub);font-weight:500}
  input[type=text],input[type=date],textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 12px;font:inherit;font-size:15px;min-height:44px}
  textarea{resize:vertical;min-height:64px}

  /* 루틴 개요 */
  .plan-list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
  .plan-list li{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px}
  .plan-list .n{width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--accent);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
  .plan-list .t{flex:1;min-width:0}
  .plan-list b{display:block;font-size:14px}
  .plan-list .ok{background:var(--accent);color:var(--accent-ink)}
  .stamp{text-align:center;padding:20px 8px 8px}
  .stamp .seal{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:132px;height:132px;border-radius:50%;border:4px solid var(--ok);color:var(--ok);transform:rotate(-8deg);font-weight:700}
  .stamp .seal b{font-size:22px}
  .stamp .seal span{font-size:12px}

  /* 플레이어 */
  .player{padding:16px 16px 18px;transition:background .3s,border-color .3s}
  .player.resting{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .player.resting .muted,.player.resting .stage-chip{color:var(--accent-ink);opacity:.9}
  .stage-chip{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
  .stage-name{font-size:18px;font-weight:700;margin:2px 0 0}
  .viz{height:220px;display:flex;align-items:center;justify-content:center;margin:12px 0 4px;position:relative}
  .cue{text-align:center;font-size:22px;font-weight:700;margin-top:4px;min-height:30px}
  .cue-sub{text-align:center;font-size:14px;color:var(--sub);margin-top:4px;min-height:20px}
  .player.resting .cue-sub{color:var(--accent-ink)}
  .count{display:flex;justify-content:center;gap:16px;margin-top:14px;font-size:14px;font-weight:600}
  .count span{background:var(--bg);border-radius:999px;padding:6px 12px}
  .player.resting .count span{background:rgba(255,255,255,.18)}
  .ctrl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
  .ctrl .btn{font-size:13px;padding:10px 6px}
  .player.resting .ctrl .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:var(--accent-ink)}
  .bigtime{font-size:76px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
  .circle{width:200px;height:200px;border-radius:50%;background:var(--tint);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;transition:transform .1s linear}
  .circle span{font-size:40px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .stairs{display:flex;align-items:flex-end;gap:6px;height:180px}
  .stairs i{width:34px;border-radius:6px 6px 2px 2px;background:var(--line);transition:background .15s}
  .stairs i.on{background:var(--accent)}
  .stairs i.past{background:var(--tint2)}
  .metro{margin-top:12px;display:flex;justify-content:center}

  /* 설명 (기본 접힘) */
  details.explain{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
  details.explain summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--sub);list-style:none;display:flex;justify-content:space-between;min-height:28px;align-items:center}
  details.explain summary::-webkit-details-marker{display:none}
  details.explain summary::after{content:'펼치기';font-weight:500}
  details.explain[open] summary::after{content:'접기'}
  .player.resting details.explain summary{color:var(--accent-ink)}
  dl.guide{display:grid;grid-template-columns:76px 1fr;gap:8px 10px;margin:10px 0 0;font-size:13px;line-height:1.55}
  dl.guide dt{font-weight:600}
  dl.guide dd{margin:0;color:var(--sub)}
  .player.resting dl.guide dd{color:var(--accent-ink)}

  /* 하단 전체 진행률 */
  .meter{position:relative;height:22px;background:var(--bg);border:1px solid var(--line);border-radius:11px;margin:6px 0 4px;overflow:hidden}
  .meter .zone{position:absolute;top:0;bottom:0}
  .meter .zone.singer{background:var(--tint2);opacity:.7}
  .meter .zone.goal{border-left:2px solid var(--ok);border-right:2px solid var(--ok);background:rgba(31,138,91,.12)}
  .meter .dot{position:absolute;top:2px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#e0a400;transition:left .08s linear;box-shadow:0 0 0 2px var(--card)}
  .auto{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--sub);cursor:pointer}
  .auto input{width:18px;height:18px;accent-color:var(--accent)}
  .progress-dock{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:6;background:var(--card);border-top:1px solid var(--line);padding:8px 16px}
  .progress-dock .in{max-width:520px;margin:0 auto}
  .progress-dock .row{font-size:12px;color:var(--sub);margin-bottom:5px}
  .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .2s linear}

  /* 기록 */
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center}
  .stat b{display:block;font-size:20px;font-weight:700}
  .stat span{font-size:12px;color:var(--sub)}
  .grid{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:4px;margin-top:12px;align-items:center}
  .grid .h{font-size:11px;color:var(--sub);text-align:center}
  .grid .wk{font-size:11px;color:var(--sub);line-height:1.2}
  .grid .wk b{display:block;color:var(--ink);font-size:12px}
  .cell{border:0;padding:3px;border-radius:8px;background:transparent;cursor:pointer;display:grid;grid-template-rows:auto 1fr 1fr;gap:2px;aspect-ratio:1/1.15;min-height:44px}
  .cell .d{font-size:10px;color:var(--sub);text-align:center;line-height:1.2}
  .cell .h2{border-radius:4px;background:var(--line)}
  .cell .h2.p{background:var(--tint2)}
  .cell .h2.f{background:var(--accent)}
  .cell.future .h2{background:transparent;border:1px dashed var(--line)}
  .cell.today{outline:2px solid var(--accent);outline-offset:-1px}
  .stageline{grid-column:1/-1;font-size:11px;font-weight:600;color:var(--accent);margin-top:8px}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--sub)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
  .wtable{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:4px;margin-top:12px;font-size:12px;text-align:center}
  .wtable .c{height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--line)}
  .wtable .c.f{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .wtable .c.p{background:var(--tint2);border-color:var(--tint2)}
  .wtable .lbl{display:flex;align-items:center;color:var(--sub)}

  /* 효과 */
  .lead{background:var(--tint);border-color:var(--tint2)}
  .lead b{font-size:16px;line-height:1.5;display:block}
  .lead p{margin:8px 0 0;font-size:14px;color:var(--sub);line-height:1.6}
  details.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;box-shadow:var(--shadow)}
  details.ex summary{padding:16px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;min-height:52px}
  details.ex summary::-webkit-details-marker{display:none}
  details.ex summary::after{content:'+';margin-left:auto;color:var(--sub);font-size:20px;font-weight:400}
  details.ex[open] summary::after{content:'−'}
  details.ex .body{padding:0 16px 16px}
  .exn{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .roadmap{display:grid;gap:6px;margin-top:4px;font-size:13px}
  .roadmap div{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--bg);border-radius:10px}
  .roadmap div.now{background:var(--tint);outline:1.5px solid var(--accent)}
  .roadmap b{font-weight:600}
  .elist{margin:8px 0 0;padding-left:18px;font-size:14px;line-height:1.7}
  .rule{margin-top:4px;background:var(--bg);border-radius:10px;padding:12px}
  .rule p{margin:6px 0 0;font-size:13px;color:var(--sub);line-height:1.6}

  /* 탭 */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:7}
  nav.tabs button{border:0;background:none;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--sub);cursor:pointer;min-height:52px}
  nav.tabs button.on{color:var(--accent);font-weight:600}
  nav.tabs svg{width:22px;height:22px}
  .scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
  .sess{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
  .toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}
  .hidden{display:none !important}
  .setup h1{font-size:26px;margin:8px 0 4px;letter-spacing:-.02em}

  /* 노래 연습 */
  .sp-top{align-items:center}
  .sp-select{width:100%;font:inherit;font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--ink);background:transparent;border:0;padding:0 22px 0 0;min-height:40px;appearance:none;-webkit-appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 10px) 55%,calc(100% - 5px) 55%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
  .sp-card{padding:12px}
  .sp-read{display:grid;grid-template-columns:1.2fr 1.2fr .8fr;gap:6px;margin-bottom:10px}
  .sp-read > div{background:var(--bg);border-radius:12px;padding:8px 10px;min-width:0}
  .sp-read span{display:block;font-size:11px}
  .sp-read b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .sp-read small{display:block;font-size:11px;color:var(--sub);min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sp-goal{font-style:normal;opacity:.8}
  .sp-cents.ok{color:var(--ok);font-weight:600} .sp-cents.bad{color:#d9534f;font-weight:600}
  .sp-rich.ok{color:var(--ok)} .sp-rich.low{color:#c98a00} .sp-rich.high{color:#d9534f}
  .sp-canvas{position:relative;height:min(48vh,380px);min-height:240px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
  .sp-canvas canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .sp-lyrics{margin-top:10px;min-height:52px}
  .sp-ln{font-size:17px;line-height:1.5;word-break:keep-all}
  .sp-ln.next{font-size:13px;color:var(--sub)}
  .sp-ln em{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);margin-right:6px;vertical-align:2px}
  .sp-ln span.w{margin-right:.28em}
  .sp-ln span.on{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:4px}
  .sp-result{font-size:13px;color:var(--sub);margin-top:6px;min-height:20px}
  .sp-result.good b{color:var(--ok)} .sp-result.mid b{color:#c98a00} .sp-result.low b{color:#d9534f}
  .sp-transport{display:grid;grid-template-columns:52px 1fr 52px 1fr;gap:8px;margin-top:10px}
  .sp-transport .btn{padding:10px 6px}
  .sp-range{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px}
  .sp-range .btn{flex:none;width:44px;padding:6px}
  .sp-phrases{display:flex;gap:6px;overflow-x:auto;margin:10px -12px 0;padding:2px 12px 6px;scrollbar-width:thin}
  .sp-phrases .chip{flex:none;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;font-size:13px}
  .sp-phrases .chip em{font-style:normal;font-weight:700;font-size:11px;opacity:.75}
  .sp-phrases .chip i{font-style:normal;font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--bg)}
  .sp-phrases .chip i.good{color:var(--ok)} .sp-phrases .chip i.mid{color:#c98a00} .sp-phrases .chip i.low{color:#d9534f}
  .sp-phrases .chip.cur{outline:2px solid var(--accent);outline-offset:1px}
  .sp-range-input{width:100%;accent-color:var(--accent);min-height:32px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="progress-dock hidden" id="dock">
  <div class="in">
    <div class="row"><span id="dockLabel">전체 진행률</span><span id="dockTime"></span></div>
    <div class="bar"><i id="dockBar"></i></div>
  </div>
</div>

<nav class="tabs" aria-label="화면 전환">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg>루틴</button>
  <button data-tab="hm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>노래</button>
  <button data-tab="record"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8 3v3M16 3v3"/></svg>기록</button>
  <button data-tab="effect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>효과</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>설정</button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">
<input type="file" id="songFile" accept="application/json,.json" class="hidden">

<script>
/* =========================================================
   SOVT 발성 훈련 — 6개월 플랜 + START 한 번으로 끝나는 자동 루틴
   기록은 이 기기 브라우저(localStorage)에만 저장
   ========================================================= */
const KEY = 'sovt-log-v1';

// ---------- 날짜 유틸 ----------
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diff = (a,b) => Math.round((parse(b)-parse(a))/864e5);   // b - a (일)
const WD = ['일','월','화','수','목','금','토'];
const md = s => { const d=parse(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const wd = s => WD[parse(s).getDay()];
const today = () => ymd(new Date());
const mmss = s => `${Math.floor(s/60)}:${pad(Math.max(0,s)%60)}`;
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- 저장소 ----------
const _start0 = addDays(today(), 1);
const DEFAULTS = {
  startDate:_start0, targetDate:addDays(_start0,76), endDate:addDays(_start0,181),
  song:'', voice:'low', bpm:110, rest:15, inhale:5, exhale:8, devInhale:'device', beep:true, pitch:true, guideSound:'auto', setupDone:false, lower:{}, logs:{}
};
let S;
function load(){
  try{ const raw=localStorage.getItem(KEY); S = raw ? {...DEFAULTS, ...JSON.parse(raw)} : {...DEFAULTS}; }
  catch(e){ S={...DEFAULTS}; }
  if(!S.logs || typeof S.logs!=='object') S.logs={};

  if(!S.endDate || diff(S.targetDate,S.endDate) < 14) S.endDate = addDays(S.startDate,181);

  if(S.planV===2 && !S.v3){ if(S.inhale===4) S.inhale=5; S.v3=true; } // 들숨 기본 4초 → 5초

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('저장 실패: 브라우저 저장 공간을 확인해 주세요'); } }

// ---------- 6개월 3단계 ----------
function p2End(){ return addDays(S.targetDate, Math.round(diff(S.targetDate,S.endDate)/2)); }
const PHASES = {
  1:{name:'기구 집중기', desc:'SOVT 기구로 목 조임을 풀고 공명 길 만들기'},
  2:{name:'자립기', desc:'기구는 웜업으로 줄이고 맨소리 비중 늘리기'},
  3:{name:'자동화기', desc:'의식하지 않아도 같은 발성이 나오게 굳히기'}
};
function phaseOf(date){
  if(diff(S.startDate,date) < 0) return 0;
  if(diff(date,S.targetDate) >= 0) return 1;
  if(diff(date,p2End()) >= 0) return 2;
  if(diff(date,S.endDate) >= 0) return 3;
  return 4;
}
function phaseRange(p){
  if(p===1) return [S.startDate, S.targetDate];
  if(p===2) return [addDays(S.targetDate,1), p2End()];
  return [addDays(p2End(),1), S.endDate];
}
const weekOf = date => Math.floor(diff(S.startDate,date)/7)+1;
const totalWeeks = () => Math.ceil((diff(S.startDate,S.endDate)+1)/7);
const songTxt = () => S.song ? `〈${S.song}〉` : '목표 곡';

// ---------- 음 높이 ----------
// 음 이름은 과학적 표기(A4=440Hz). 한국식 "2옥타브 라" = A4, "3옥타브 도" = C5
// low = 낮은 목소리 기준, high = 모든 음을 한 옥타브 위로
const SEMI = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const SOL = {C:'도',D:'레',E:'미',F:'파',G:'솔',A:'라',B:'시'};
const midiOf = n => (Number(n.slice(-1))+1)*12 + SEMI[n[0]];
const hz = midi => 440*Math.pow(2,(midi-69)/12) * (S.voice==='high'?2:1);
const koName = n => `${Number(n.slice(-1))-2+(S.voice==='high'?1:0)}옥타브 ${SOL[n[0]]}`;
const koMidi = m => { const names=['C','C','D','D','E','F','F','G','G','A','A','B']; const nm=names[m%12]+(Math.floor(m/12)-1); return koName(nm)+([1,3,6,8,10].includes(m%12)?'#':''); };
const SIREN_LOW = 'A2';
// 6개월 음정 로드맵: 슬라이딩 최고음(살짝 닿기) / 계단 최고음(정확히 안착)
const LEVELS = [
  {siren:'F4', arp:'E4'}, {siren:'G4', arp:'F4'}, {siren:'A4', arp:'G4'},   // 1단계: 파 → 솔 → 라
  {siren:'A4', arp:'A4'}, {siren:'B4', arp:'A4'},                          // 2단계: 라 안정 → 시
  {siren:'C5', arp:'B4'}, {siren:'C5', arp:'C5'}                           // 3단계: 3옥타브 도
];
function autoLevel(date){
  const ph=phaseOf(date); if(ph===0) return 0; if(ph===4) return 6;
  const [a,b]=phaseRange(ph); const f=diff(a,date)/(diff(a,b)+1);
  if(ph===1) return f<0.27?0 : f<0.55?1 : 2;
  if(ph===2) return f<0.4?3 : 4;
  return f<0.4?5 : 6;
}
function levelOf(date){ return Math.max(0, autoLevel(date) - (S.lower[date]?1:0)); }
// 레벨이 바뀌는 날짜 구간 (효과 탭 로드맵용)
function levelRanges(){
  const out=[]; let d=S.startDate, cur=autoLevel(d), from=d;
  while(diff(d,S.endDate)>=0){ const l=autoLevel(d); if(l!==cur){ out.push({l:cur,from,to:addDays(d,-1)}); cur=l; from=d; } d=addDays(d,1); }
  out.push({l:cur,from,to:S.endDate}); return out;
}

// ---------- 오늘의 루틴 만들기 ----------
function buildRoutine(date){
  const ph = Math.max(1, Math.min(3, phaseOf(date)));
  const late = ph===1 && diff(date,S.targetDate) <= 20;   // 목표일 3주 전부터 실전 전환
  const lv = levelOf(date), L = LEVELS[lv];
  const top = L.siren, arpTop = L.arp;
  const devIn = S.devInhale!=='quick';
  const R = [];

      ['날숨',`${S.exhale}초 동안 원이 줄어드는 속도에 맞춰 일정하게. 촛불이 기울기만 하는 세기`],

  const siren = sets => ({ id:'siren', kind:'siren', name:'SOVT 슬라이딩', sub:`기구로 "우~" 편한 저음 → ${koName(top)} → 저음`, sets, reps:5, top,
    prep:'기구를 물고 "우~" 준비. 가이드음을 따라 오르내려요',
    guide:[

      ['시작음',`편하게 말하는 높이보다 조금 낮은 곳 (가이드음은 낮은 목소리 기준 A2, 높은 목소리 기준 A3). 가이드음과 정확히 같지 않아도 되고, 편한 저음에서 시작하면 돼요`],
      ['저음','내려올 때도 입술·코 주변 진동(앞쪽 울림)을 그대로. 목 아래로 툭 떨어뜨리지 않기'],
      ['호흡','올라갈 때 더 밀지 않고, 내려올 때 풀지 않기. 바람 세기는 처음부터 끝까지 같게'],
      ['들숨', devIn ? `기구로 ${S.inhale}초 천천히 (설정에서 "입·코로 빠르게"로 바꿀 수 있어요)` : '입·코로 3초 가볍게'],
      ['꺾일 때','뒤집혀도 괜찮아요. 그 구간을 더 작고 가볍게'],
      ['범위','최고음은 6개월 로드맵에 따라 자동으로 넓어져요. 목이 조이면 "오늘은 한 단계 낮게"'],
    ]});
  const arp = (sets, deviceSets, vowel) => ({ id:'arp', kind:'arp', name:'음정 도약', sub:`도-미-솔-도-솔-미-도 · 최고 ${koName(arpTop)}`, sets, reps:2, deviceSets, arpTop, vowel,
    prep: deviceSets>0 ? '기구를 물고 "우~"로 계단을 따라가요' : `기구를 빼고 "${vowel}~"으로 계단을 따라가요`,
    guide:[

    guide:[

    prep: mode==='mumble' ? '기구를 문 채 입은 닫고, 혀만 움직여 가사를 웅얼거려요' : mode==='alt' ? '기구로 1소절 부르고, 바로 빼고 같은 소절을 불러요' : '기구 없이 편하게 불러요. 발성 생각은 내려놓기',

      ['메트로놈','템포를 몸에 익히고 싶으면 켜기 (BPM은 설정에서 곡에 맞게)'],
    ] : mode==='alt' ? [
      ['방법','기구로 1소절 → 기구 빼고 바로 같은 1소절. 번갈아 반복'],

      ['실전','MR이 있으면 같이 틀고 리듬·가사 전달 위주로'],
    ] : [
      ['방법','다양한 곡을 기구 없이. 막히는 소절만 기구로 1번'],
      ['집중','발성은 생각하지 않기. 리듬·가사·감정에만'],

  if(ph===1){ R.push(breath(3), siren(3), arp(3,2,'멈')); if(lv>=2) R.push(long(1,true,'우')); R.push(free(2, late?'alt':'mumble')); }
  else if(ph===2){ R.push(breath(1), siren(2), arp(2,0,'멈'), long(2,false,'우'), free(2,'free')); }
  else { R.push(siren(1), arp(1,0,'멈'), long(2,false,'아'), free(2,'free')); }
  return { phase:ph, late, lv, top, arpTop, stages:R };
}

// 루틴을 시간 구간(segment) 목록으로 펼침 → 진행률·자동 전환에 사용
function flatten(routine){
  const segs=[]; const restMs=S.rest*1000;
  const inMs = dev => (dev && S.devInhale!=='quick') ? S.inhale*1000 : 3000;
  routine.stages.forEach((st,si)=>{
    segs.push({si, type:'prep', dur:5000, cue:'준비', sub:st.prep});
    for(let set=1; set<=st.sets; set++){
      if(st.kind==='arp' && set===st.deviceSets+1 && set>1)
        segs.push({si, set, type:'prep', dur:5000, cue:'기구 빼기', sub:`이번 세트부터 기구 없이 "${st.vowel}~"`});
      for(let rep=1; rep<=st.reps; rep++){
        if(st.kind==='breath'){
          segs.push({si,set,rep,type:'inhale',dur:S.inhale*1000,cue:'들숨',sub:'기구를 문 채 입으로 천천히'});
          segs.push({si,set,rep,type:'exhale',dur:S.exhale*1000,cue:'날숨',sub:'원이 줄어드는 속도로 일정하게',count:true});
        } else if(st.kind==='siren'){
          const d=S.devInhale!=='quick';
          segs.push({si,set,rep,type:'inhale',dur:inMs(true),cue:'들숨',sub:d?'기구를 문 채 입으로 천천히':'입·코로 가볍게',preview:midiOf(SIREN_LOW)});
          segs.push({si,set,rep,type:'siren',dur:6000,cue:'"우~" 슬라이딩',sub:'올라갈 때도 내려올 때도 같은 바람',count:true});
        } else if(st.kind==='arp'){
          const dev = set<=st.deviceSets;
          const topM = midiOf(st.arpTop) - 2*(st.sets-set), base = topM-12;
          segs.push({si,set,rep,type:'inhale',dur:inMs(dev),cue:'들숨',sub:dev?'기구를 문 채 입으로':'입·코로 가볍게', preview:base});
          segs.push({si,set,rep,type:'arp',dur:14000,cue:dev?'"우~"':`"${st.vowel}~"`,sub:`꼭대기 ${koMidi(topM)}`,count:true,dev,base});
        } else if(st.kind==='long'){
          const base = midiOf(st.arpTop)-12, m = base + [5,7,9,12][rep-1];
          segs.push({si,set,rep,type:'inhale',dur:Math.max(inMs(st.dev),3000),cue:'들숨 · 음 듣기',sub:koMidi(m),preview:m,hold:true});
          segs.push({si,set,rep,type:'long',dur:8000,cue:st.dev?'"우~" 직선으로':`"${st.vowel}~" 직선으로`,sub:`${koMidi(m)} · 흔들림 없이`,count:true,midi:m});
        } else {
          segs.push({si,set,rep,type:'free',dur:st.min*60000,cue:st.sub,sub:st.prep});
        }
      }
      if(set<st.sets) segs.push({si,set,type:'rest',dur:restMs,cue:'휴식',sub:'기구를 내려놓고 평소대로 숨 쉬기'});
    }
  });
  let acc=0; segs.forEach(s=>{ s.at=acc; acc+=s.dur; });
  return { segs, total:acc };
}

// ---------- 세션 기록 ----------
function sess(date, slot, create){
  if(!S.logs[date]){ if(!create) return null; S.logs[date]={}; }
  if(!S.logs[date][slot]){ if(!create) return null; S.logs[date][slot]={done:false,progress:0,secs:0,mood:0,memo:''}; }
  return S.logs[date][slot];
}
function status(s){ if(!s) return ''; if(s.done) return 'f'; if((s.progress||0)>0 || (s.sets||[]).some(x=>x>0)) return 'p'; return ''; }

// ---------- 오디오 (가이드음·알림음) ----------
let actx=null, segOut=null, metroIv=null;
function ac(){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){ actx=null; }
  return actx;
}
function out(){ // 현재 구간 전용 출력 → 건너뛸 때 한 번에 끊기
  const a=ac(); if(!a) return null;
  if(!segOut){ segOut=a.createGain(); segOut.connect(a.destination); }
  return segOut;
}
function cutAudio(){ try{ segOut && segOut.disconnect(); }catch(e){} segOut=null; }
function tone(freq, t0, dur, vol=0.18, type='triangle', dest){
  const a=ac(); if(!a) return; dest = dest || a.destination;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(dest);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.03);
  g.gain.exponentialRampToValueAtTime(vol*0.5,t0+dur*0.6); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.start(t0); o.stop(t0+dur+0.05);
}
function beep(freq=880, dur=0.15){ if(!S.beep) return; const a=ac(); if(a) tone(freq, a.currentTime, dur, 0.2, 'sine'); }
function piano(freq, t0, dur, dest){ tone(freq,t0,dur,0.16,'triangle',dest); tone(freq*2,t0,dur*0.6,0.04,'sine',dest); }
function sirenSound(lo, hi, dur){
  const a=ac(), d=out(); if(!a||!d) return;
  const t=a.currentTime, o=a.createOscillator(), g=a.createGain();
  o.type='sine'; o.connect(g); g.connect(d);
  o.frequency.setValueAtTime(lo,t); o.frequency.exponentialRampToValueAtTime(hi,t+dur/2); o.frequency.exponentialRampToValueAtTime(lo,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.12,t+0.2); g.gain.setValueAtTime(0.12,t+dur-0.2); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t); o.stop(t+dur+0.05);
}
const ARP = [0,4,7,12,7,4,0];
function arpSound(base){
  const a=ac(), d=out(); if(!a||!d) return;
  const t=a.currentTime; ARP.forEach((st,i)=>piano(base*Math.pow(2,st/12), t+i*2, 1.9, d));
}
function fanfare(){ const a=ac(); if(!a) return; const t=a.currentTime; [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*0.14,i===3?0.6:0.18,0.2,'triangle')); }
function metroToggle(force){
  const on = force!==undefined ? force : !metroIv;
  clearInterval(metroIv); metroIv=null;
  if(on){ const a=ac(); if(!a) return; const ms=60000/(S.bpm||110); let n=0;
    metroIv=setInterval(()=>{ if(P && !P.paused){ tone(n%4===0?1500:1000, a.currentTime, 0.04, 0.12, 'square'); n++; } }, ms); }
  const b=document.getElementById('metroBtn'); if(b) b.textContent = metroIv ? `메트로놈 끄기 (${S.bpm} BPM)` : `메트로놈 켜기 (${S.bpm} BPM)`;

// ---------- 화면 꺼짐 방지 ----------
let wakeLock=null;
async function keepAwake(on){
  try{
    if(on && !wakeLock && navigator.wakeLock){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); }
    if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){ wakeLock=null; }
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && P && !P.paused) keepAwake(true); });

// ---------- 플레이어 ----------
let P = null;   // {routine, segs, total, i, segStart, elapsedBefore, paused, pausedAt, date, slot}
let tickIv = null;

// ---------- 마이크 음정 측정 ----------
// 내 목소리 높이를 실시간으로 잡아 가이드선과 함께 그려줌 (HTTPS 설치 버전에서 동작)
let mic = { on:false, stream:null, an:null, buf:null, err:'' };
async function startMic(){
  if(!S.pitch) return false;
  if(mic.on) return true;
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw new Error('unsupported');
    const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    const a=ac(); const src=a.createMediaStreamSource(stream); const an=a.createAnalyser(); an.fftSize=8192; an.smoothingTimeConstant=0;
    src.connect(an);   // 스피커로는 내보내지 않음
    mic={on:true, stream, an, buf:new Float32Array(an.fftSize), err:''};
    return true;
  }catch(e){
    mic.on=false; mic.err = (e && e.name==='NotAllowedError') ? '마이크 권한이 거부됐어요' : '이 화면에서는 마이크를 쓸 수 없어요 (설치한 앱에서 사용)';
    return false;
  }
}
function stopMic(){ try{ mic.stream && mic.stream.getTracks().forEach(t=>t.stop()); }catch(e){} mic={on:false,stream:null,an:null,buf:null,err:mic.err}; }
// YIN 방식 음높이 검출 → Hz (소리가 작거나 불분명하면 0)
function detectPitch(){
  if(!mic.on) return 0;
  const buf=mic.buf; mic.an.getFloatTimeDomainData(buf);
  const sr=actx.sampleRate, W=2048, N=W*2;
  const x=buf.subarray(buf.length-N);                 // 가장 최근 샘플만 사용
  let mean=0; for(let i=0;i<N;i++) mean+=x[i]; mean/=N;
  let rms=0; for(let i=0;i<N;i++){ const v=x[i]-mean; rms+=v*v; } rms=Math.sqrt(rms/N);
  if(rms<0.004){ mic.hist=[]; return 0; }              // 너무 작은 소리는 무시
  const minT=Math.floor(sr/1100), maxT=Math.min(W-1,Math.floor(sr/65));
  if(!mic.d || mic.d.length!==maxT+1) mic.d=new Float32Array(maxT+1);
  const d=mic.d; d[0]=1;
  // YIN: 차이 함수 → 누적 평균 정규화 (모든 지연값에 대해 계산)
  let run=0;
  for(let t=1;t<=maxT;t++){
    let s2=0; for(let i=0;i<W;i++){ const v=x[i]-x[i+t]; s2+=v*v; }
    run+=s2; d[t]= run ? s2*t/run : 1;
  }
  let best=-1, gmin=1, gidx=-1;
  for(let t=minT;t<=maxT;t++){
    if(d[t]<gmin){ gmin=d[t]; gidx=t; }
    if(best<0 && d[t]<0.12){ while(t+1<=maxT && d[t+1]<d[t]) t++; best=t; break; }
  }
  if(best<0){ if(gmin<0.3) best=gidx; else return 0; }
  const a0=d[best-1]??d[best], b0=d[best], c0=d[best+1]??d[best];
  const sh=(a0+c0-2*b0) ? (a0-c0)/(2*(a0+c0-2*b0)) : 0;
  let f=sr/(best+sh);
  // 중앙값 필터 (최근 5개): 순간적인 옥타브 튐은 여기서 걸러짐. 실제 옥타브 도약(예: 팝콘 첫 소절)은 그대로 따라감
  mic.hist=mic.hist||[];
  mic.hist.push(f); if(mic.hist.length>5) mic.hist.shift();
  const sorted=[...mic.hist].sort((p,q)=>p-q);
  return sorted[Math.floor(sorted.length/2)];
}
const toMidi = f => 69+12*Math.log2(f/440) - (S.voice==='high'?12:0);   // 화면 기준(가이드와 같은 스케일)
const SCI = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const sciName = m => SCI[((Math.round(m)%12)+12)%12] + (Math.floor(Math.round(m)/12)-1 + (S.voice==='high'?1:0));
// 현재 구간의 가이드 음높이 (midi)
function guideMidi(g, e){
  const st=P.routine.stages[g.si];
  if(g.type==='siren'){ const lo=midiOf(SIREN_LOW), hi=midiOf(st.top), p=e/g.dur; return lo+(hi-lo)*(p<0.5?p*2:2-2*p); }
  if(g.type==='arp') return g.base + ARP[Math.min(6,Math.floor(e/2000))];
  if(g.type==='long') return g.midi;
  return null;
}
const pitchSeg = g => mic.on && (g.type==='siren'||g.type==='arp'||g.type==='long');
const soundDuring = () => !mic.on || S.guideSound==='always';
function drawPitch(g, e){
  const cv=document.getElementById('pcv'); if(!cv) return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
  if(cv.width!==W*dpr){ cv.width=W*dpr; cv.height=H*dpr; }
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,W,H);
  const st=P.routine.stages[g.si];
  let lo, hi;
  if(g.type==='siren'){ lo=midiOf(SIREN_LOW)-2; hi=midiOf(st.top)+3; }
  else if(g.type==='arp'){ lo=g.base-3; hi=g.base+15; }
  else { lo=g.midi-6; hi=g.midi+6; }
  const css=getComputedStyle(document.documentElement);
  const cLine=css.getPropertyValue('--line').trim(), cSub=css.getPropertyValue('--sub').trim(), cAcc=css.getPropertyValue('--accent').trim();
  const L=34, Y=m=>H-6-(m-lo)/(hi-lo)*(H-12), X=t=>L+t*(W-L-6);
  // 음 격자 (C는 진하게)
  x.font='10px system-ui'; x.textBaseline='middle';
  for(let m=Math.ceil(lo); m<=hi; m++){
    const nat=[0,2,4,5,7,9,11].includes(((m%12)+12)%12); if(!nat) continue;
    const isC=((m%12)+12)%12===0;
    x.strokeStyle=cLine; x.lineWidth=isC?1.4:0.6; x.beginPath(); x.moveTo(L,Y(m)); x.lineTo(W-6,Y(m)); x.stroke();
    if(hi-lo<16 || isC || (g.type==='siren' && m===midiOf(st.top))){ x.fillStyle=cSub; x.fillText(sciName(m),2,Y(m)); }
  }
  // 가이드선
  x.strokeStyle=cAcc; x.globalAlpha=0.35; x.lineWidth=10; x.lineCap='round'; x.beginPath();
  for(let i=0;i<=60;i++){ const t=i/60, m=guideMidi(g,t*g.dur); i?x.lineTo(X(t),Y(m)):x.moveTo(X(t),Y(m)); } x.stroke(); x.globalAlpha=1;
  // 가이드 음 이름 (작은 글씨)
  x.font='600 11px system-ui'; x.fillStyle=cAcc; x.textBaseline='bottom'; x.textAlign='center';
  const tag=(t,m)=>{ const px=Math.min(W-30,Math.max(L+28,X(t))); x.fillText(koMidi(Math.round(m)),px,Y(m)-8); };
  if(g.type==='arp') ARP.forEach((d,i)=>tag((i+0.5)/7, g.base+d));
  else if(g.type==='siren'){ tag(0.06, midiOf(SIREN_LOW)); tag(0.5, midiOf(st.top)); }
  else tag(0.5, g.midi);
  x.textAlign='left'; x.textBaseline='middle';
  // 내 소리 (노란 선)
  x.strokeStyle='#f2b705'; x.lineWidth=2.5; x.beginPath(); let started=false;
  for(const p of P.trace){ if(p.m==null){ started=false; continue; } const px=X(p.t), py=Y(Math.max(lo,Math.min(hi,p.m))); started?x.lineTo(px,py):x.moveTo(px,py); started=true; }
  x.stroke();
  // 현재 위치 세로선
  x.strokeStyle=cSub; x.globalAlpha=0.4; x.lineWidth=1; x.beginPath(); x.moveTo(X(e/g.dur),4); x.lineTo(X(e/g.dur),H-4); x.stroke(); x.globalAlpha=1;
}
function samplePitch(g, e){
  const f=detectPitch(); const m = f>0 ? toMidi(f) : null;
  P.trace.push({t:e/g.dur, m});
  const gm=guideMidi(g,e), tol = g.type==='siren' ? 1.0 : 0.5;   // 반음 단위 허용 오차
  const out=document.getElementById('pnow');
  if(m!=null && gm!=null){
    P.voiced++; const diff=m-gm; if(Math.abs(diff)<=tol) P.hit++;
    if(out){ const c=Math.round(diff*100); const gap = Math.abs(c)>=100 ? `반음 ${Math.round(Math.abs(diff))}개` : `${Math.abs(c)}센트`; out.textContent = `${sciName(m)} · ${Math.abs(c)<=tol*100?'맞음':`${gap} ${c>0?'높음':'낮음'}`}`; out.style.color = Math.abs(diff)<=tol ? 'var(--ok)' : 'var(--sub)'; }
  } else if(out) out.textContent='소리를 기다리는 중';
  const acc=document.getElementById('pacc'); if(acc && P.voiced>4) acc.textContent=`정확도 ${Math.round(P.hit/P.voiced*100)}%`;
}

async function startRoutine(){
  const date=today(); const routine=buildRoutine(date); const {segs,total}=flatten(routine);
  ac(); // 사용자 터치로 오디오 시작 (모바일 필수)
  P = {routine, segs, total, i:-1, elapsedBefore:0, paused:false, date, slot, t0:Date.now(), trace:[], hit:0, voiced:0, accs:[]};
  const s=sess(date,slot,true); s.done=false;
  keepAwake(true); nextSeg();
  clearInterval(tickIv); tickIv=setInterval(tick, 50);
  if(S.pitch){ const ok=await startMic(); if(!ok && mic.err) toast(mic.err+' · 화면 가이드만 보여줘요'); if(P) render(); }
}
function curSeg(){ return P && P.segs[P.i]; }
function segElapsed(){ if(!P) return 0; return P.paused ? P.pausedAt - P.segStart : Date.now() - P.segStart; }
function nextSeg(){
  if(P.i>=0){
    const prev=curSeg();
    if(prev.count){ beep(1320,0.09); }
    if(prev.type==='rest'){ beep(880,0.35); }
    if(pitchSeg(prev) && P.voiced>10) P.accs.push(P.hit/P.voiced);
  }
  enterSeg(P.i+1);
}
// 특정 구간으로 이동해서 시작 (다음·이전·건너뛰기 공용)
function enterSeg(idx){
  cutAudio();
  P.trace=[]; P.hit=0; P.voiced=0; P.lastBeep=null;
  P.i=Math.max(0,idx);
  if(P.i>=P.segs.length){ finishRoutine(); return; }
  const g=curSeg(); P.segStart=Date.now(); P.elapsedBefore=g.at;
  saveProgress();
  const st=P.routine.stages[g.si];
  // 마이크를 쓸 때는 가이드음이 마이크에 섞이지 않게 들숨 때 미리 들려주고, 소리 낼 땐 화면만
  if(soundDuring()){
    if(g.type==='siren') sirenSound(hz(midiOf(SIREN_LOW)), hz(midiOf(st.top)), g.dur/1000);
    if(g.type==='arp') arpSound(hz(g.base));
  }
  if(g.type==='inhale' && g.preview!==undefined){ const a=ac(), d=out(); if(a&&d) piano(hz(g.preview), a.currentTime+0.2, g.hold?2.2:1.2, d); }
  if(g.type==='prep' && g.dur) beep(660,0.12);
  if(g.type!=='free' && metroIv) metroToggle(false);
  render();
}
// 뒤로: 2초 이상 진행했으면 이번 회차를 처음부터(들숨부터), 막 시작했으면 바로 앞 구간으로
function goBack(){
  if(!P) return; if(P.paused) togglePause();
  const g=curSeg(), e=segElapsed();
  let to = P.i;
  if(e<2000) to = P.i-1;
  const t=P.segs[to];
  if(t && t.count && to>0 && P.segs[to-1].type==='inhale' && P.segs[to-1].rep===t.rep && P.segs[to-1].si===t.si) to--;
  enterSeg(Math.max(0,to));
}
// 이 구간만 건너뛰기 (휴식·준비·타이머 등)
function skipSeg(){ if(!P) return; if(P.paused) togglePause(); nextSeg(); }
function tick(){
  if(!P || P.paused) return;
  const g=curSeg(); if(!g) return;
  const e=segElapsed();
  if((g.type==='rest'||g.type==='prep') ){
    const left=Math.ceil((g.dur-e)/1000);
    if(left<=3 && left>0 && left!==P.lastBeep){ P.lastBeep=left; beep(660,0.1); }
  }
  if(e>=g.dur){ P.lastBeep=null; nextSeg(); return; }
  if(pitchSeg(g)){ samplePitch(g,e); drawPitch(g,e); }
  paintTick(g,e);
}
function paintTick(g,e){
  const left=Math.max(0,Math.ceil((g.dur-e)/1000));
  const el=id=>document.getElementById(id);
  if(el('tleft')) el('tleft').textContent = g.type==='free' ? mmss(left) : left;
  if(g.type==='inhale' && el('circle') && P.routine.stages[g.si].kind==='breath') el('circle').style.transform=`scale(${0.55+0.45*(e/g.dur)})`;
  if(g.type==='exhale' && el('circle')) el('circle').style.transform=`scale(${1-0.45*(e/g.dur)})`;
  if(g.type==='siren' && el('dot')){
    const p=e/g.dur, x=20+p*280, y=170-130*Math.sin(Math.PI*p);
    el('dot').setAttribute('cx',x); el('dot').setAttribute('cy',y);
  }
  if(g.type==='long' && el('lfill')) el('lfill').style.width=`${Math.min(100,e/g.dur*100)}%`;
  if(g.type==='arp'){
    const k=Math.min(6,Math.floor(e/2000));
    document.querySelectorAll('.stairs i').forEach((b,i)=>{ b.className = i===k?'on': i<k?'past':''; });
  }
  const done=P.elapsedBefore+e, pct=Math.min(100,done/P.total*100);
  if(el('dockBar')) el('dockBar').style.width=pct+'%';
  if(el('dockTime')) el('dockTime').textContent=`${Math.round(pct)}% · 남은 ${mmss(Math.ceil((P.total-done)/1000))}`;
}
function togglePause(){
  if(!P) return;
  if(!P.paused){ P.paused=true; P.pausedAt=Date.now(); try{actx&&actx.suspend();}catch(e){} keepAwake(false); }
  else { P.segStart += Date.now()-P.pausedAt; P.paused=false; try{actx&&actx.resume();}catch(e){} keepAwake(true); }
  render();
}
function skipStage(){
  if(!P) return; const si=curSeg().si;
  let j=P.i; while(j<P.segs.length && P.segs[j].si===si) j++;
  if(P.paused) togglePause();
  P.i=j-1; const last=P.segs[j-1]; P.segStart=Date.now()-last.dur;
  nextSeg();
}
function pitchAvg(){ return P && P.accs.length ? Math.round(P.accs.reduce((a,b)=>a+b,0)/P.accs.length*100) : null; }
function saveProgress(){
  if(!P) return; const s=sess(P.date,P.slot,true);
  const g=curSeg(); const done = g ? g.at : P.total;
  s.progress=Math.max(s.progress||0, Math.round(done/P.total*100)/100);
  s.secs=Math.max(s.secs||0, Math.round((Date.now()-P.t0)/1000));
  const pa=pitchAvg(); if(pa!=null) s.pitch=pa;
  save();
}
function stopRoutine(){
  if(!P) return; saveProgress(); cutAudio(); metroToggle(false); clearInterval(tickIv); stopMic();
  P=null; keepAwake(false); render(); toast('여기까지 기록했어요');
}
function finishRoutine(){
  const s=sess(P.date,P.slot,true);
  s.done=true; s.progress=1; s.secs=Math.round((Date.now()-P.t0)/1000); s.finishedAt=Date.now();
  const pa=pitchAvg(); if(pa!=null) s.pitch=pa;
  save(); cutAudio(); metroToggle(false); clearInterval(tickIv); stopMic();
  P=null; keepAwake(false); fanfare(); try{navigator.vibrate&&navigator.vibrate([60,80,60,80,160]);}catch(e){}
  render(); window.scrollTo(0,0);
}

function renderRecord(){
  const t=today(), tw=totalWeeks();
  const curW=Math.min(Math.max(weekOf(t),1),tw), wStart=addDays(S.startDate,(curW-1)*7);
  let wDone=0; for(let i=0;i<7;i++){ const d=addDays(wStart,i); ['am','pm'].forEach(k=>{ if(sess(d,k)?.done) wDone++; }); }
  let totalSess=0, totalSecs=0;
  Object.values(S.logs).forEach(day=>['am','pm'].forEach(k=>{ const s=day[k]; if(s){ if(s.done) totalSess++; totalSecs+=s.secs||0; } }));
  let streak=0, d=t; const dayDone=x=>sess(x,'am')?.done||sess(x,'pm')?.done;
  if(!dayDone(d)) d=addDays(d,-1); while(dayDone(d)){ streak++; d=addDays(d,-1); }

  let head='<div></div>', amRow='<div class="lbl">아침</div>', pmRow='<div class="lbl">저녁</div>';
  for(let i=0;i<7;i++){ const x=addDays(wStart,i);
    head+=`<div class="muted" style="font-size:11px">${wd(x)}<br>${md(x)}</div>`;
    const a=status(sess(x,'am')), p=status(sess(x,'pm'));
    amRow+=`<div class="c ${a}">${a==='f'?'✓':''}</div>`; pmRow+=`<div class="c ${p}">${p==='f'?'✓':''}</div>`; }

  let grid='<div></div>'+Array.from({length:7},(_,i)=>`<div class="h">${wd(addDays(S.startDate,i))}</div>`).join('');
  let lastPh=0;
  for(let w=1; w<=tw; w++){
    const ws=addDays(S.startDate,(w-1)*7), ph=Math.min(3,Math.max(1,phaseOf(ws)));
    if(ph!==lastPh){ grid+=`<div class="stageline">${ph}단계 · ${PHASES[ph].name}</div>`; lastPh=ph; }
    grid+=`<div class="wk"><b>${w}주</b>${md(ws)}</div>`;
    for(let i=0;i<7;i++){ const x=addDays(ws,i);
      if(diff(x,S.endDate)<0){ grid+='<div></div>'; continue; }
      grid+=`<button class="cell ${diff(t,x)>0?'future':''} ${x===t?'today':''}" data-act="day" data-d="${x}" aria-label="${md(x)} 기록"><span class="d">${parse(x).getDate()}</span><span class="h2 ${status(sess(x,'am'))}"></span><span class="h2 ${status(sess(x,'pm'))}"></span></button>`; }
  }
  return `
    <header class="top"><div><div class="dday" style="font-size:24px">기록</div><div class="dsub">${md(S.startDate)} ~ ${md(S.endDate)} · ${tw}주</div></div><span class="badge">${curW}주차</span></header>
    <div class="stats">
      <div class="stat"><b>${streak}</b><span>연속 일수</span></div>
      <div class="stat"><b>${totalSess}</b><span>완료 루틴</span></div>
      <div class="stat"><b>${Math.round(totalSecs/60)}</b><span>누적 분</span></div>
      <div class="stat"><b>${wDone}/14</b><span>이번 주</span></div>
    </div>
    <section class="card">
      <div class="row"><h3>이번 주 (${curW}주차)</h3><span class="muted">${wDone} / 14 루틴</span></div>
      <div class="bar" style="margin-top:10px"><i style="width:${wDone/14*100}%"></i></div>
      <div class="wtable">${head}${amRow}${pmRow}</div>
    </section>
    <section class="card">
      <div class="row"><h3>전체 ${tw}주</h3><span class="muted">칸을 누르면 상세</span></div>
      <div class="grid">${grid}</div>
      <div class="legend"><span><i style="background:var(--accent)"></i>완료</span><span><i style="background:var(--tint2)"></i>하다 멈춤</span><span><i style="background:var(--line)"></i>미기록</span><span class="muted">위칸 아침 · 아래칸 저녁</span></div>
    </section>`;
}

  an.getFloatFrequencyData(mic.spec);
  const binHz = actx.sampleRate/an.fftSize, H_=[];
  for(let k=1;k<=6;k++){
    const fk=k*f, bw=Math.max(fk*0.03, 8); let mx=-200;
    for(let b=Math.floor((fk-bw)/binHz); b<=Math.ceil((fk+bw)/binHz); b++){ if(b>0 && b<n && mic.spec[b]>mx) mx=mic.spec[b]; }
    H_.push(mx);
  }
  return (H_[2]+H_[3]+H_[4]+H_[5])/4 - H_[0];
}
function measureDb(){ const b=mic.buf; let s=0; const N=Math.min(2048,b.length); for(let i=0;i<N;i++) s+=b[i]*b[i]; return 20*Math.log10(Math.sqrt(s/N)+1e-9); }

async function hmStart(kind){
  ac(); if(!S.pitch) S.pitch=true;
  const ok=await startMic(); if(!ok){ toast(mic.err||'마이크를 쓸 수 없어요'); return; }
  const h=hmState();
  H = { kind, t0:Date.now(), samples:[], noteIdx:0, dir:1, phase:'listen', phaseAt:Date.now(), results:[], rec:null, chunks:[] };
  if(kind==='calib'){ H.phase='calib'; }
  if(S.hmRec && window.MediaRecorder){ try{ H.rec=new MediaRecorder(mic.stream); H.rec.ondataavailable=e=>H.chunks.push(e.data); H.rec.start(); }catch(e){ H.rec=null; } }
  keepAwake(true);
  if(kind==='train' && h.mode!=='free') hmCue();
  clearInterval(H.iv); H.iv=setInterval(hmTick, 50);
  render();
}
function hmTarget(){ const n=hmNotes(); return n[Math.min(H.noteIdx, n.length-1)]; }
function hmCue(){ // 들려주기 1초 → 부르기 3초 → 결과 1.5초
  H.phase='listen'; H.phaseAt=Date.now(); H.samples=[];
  const a=ac(); if(a) piano(hz(midiOf(hmTarget())), a.currentTime+0.05, 1.0);
}
function hmTick(){
  if(!H) return;
  const f=detectPitch(), m = f>0 ? toMidi(f) : null, r = f>0 ? measureRich(f) : null, d=measureDb();
  const now=Date.now(), el=id=>document.getElementById(id), h=hmState(), g=HM_GOALS[h.goal];
  // 미터 표시
  if(el('hmNote')) el('hmNote').textContent = m!=null ? koMidi(Math.round(m)) : '—';
  if(r!=null && el('hmRichDot')) el('hmRichDot').style.left = `${Math.max(0,Math.min(100,(r+45)/40*100))}%`;
  if(r!=null && el('hmRichVal')) el('hmRichVal').textContent = `${r.toFixed(0)}dB`;
  const rel = h.base!=null ? d-h.base : null;
  if(m!=null && rel!=null && el('hmDbDot')) el('hmDbDot').style.left = `${Math.max(0,Math.min(100,(rel+12)/24*100))}%`;
  if(m!=null && rel!=null && el('hmDbVal')) el('hmDbVal').textContent = `${rel>0?'+':''}${rel.toFixed(1)}dB`;
  // 기준 크기 잡기: 편한 "네~" 3초
  if(H.kind==='calib'){
    if(m!=null) H.samples.push(d);
    const left=3-(now-H.t0)/1000; if(el('hmPhase')) el('hmPhase').textContent = left>0 ? `"네~" 편하게 말하는 크기로 ${Math.ceil(left)}초` : '저장 중';
    if(left<=0){ const v=H.samples.sort((a,b)=>a-b); h.base = v.length>10 ? v[Math.floor(v.length/2)] : null; save(); hmStop(false); toast(h.base!=null?'기준 크기를 저장했어요':'소리가 안 잡혔어요. 다시 해주세요'); }
    return;
  }
  if(h.mode==='free') return;
  const e=now-H.phaseAt, tgt=midiOf(hmTarget());
  if(H.phase==='listen'){ if(el('hmPhase')) el('hmPhase').textContent=`듣기 · ${koName(hmTarget())}`; if(e>1300){ H.phase='sing'; H.phaseAt=now; H.samples=[]; } return; }
  if(H.phase==='sing'){
    const left=3-e/1000; if(el('hmPhase')) el('hmPhase').textContent=`"${h.vowel}~" ${h.mode==='stac'?'짧게 여러 번':'3초 유지'} · ${Math.max(0,left).toFixed(1)}`;
    if(m!=null && r!=null) H.samples.push({m,r,rel});
    if(el('hmHold')) el('hmHold').style.width=`${Math.min(100,e/30)}%`;
    if(e>=3000){ hmScore(tgt); H.phase='result'; H.phaseAt=now; }
    return;
  }
  if(H.phase==='result' && e>1600){ hmAdvance(); hmCue(); render(); }
}
function hmScore(tgt){
  const h=hmState(), g=HM_GOALS[h.goal], sm=H.samples;
  const pitchOk=sm.filter(s=>Math.abs(s.m-tgt)<=0.6);
  const n=pitchOk.length;
  const richIn = n ? pitchOk.filter(s=>s.r>=g.lo && s.r<=g.hi).length/n : 0;
  const dbIn = (h.base==null) ? 1 : (n ? pitchOk.filter(s=>s.rel!=null && Math.abs(s.rel)<=3).length/n : 0);
  const med = n ? pitchOk.map(s=>s.r).sort((a,b)=>a-b)[Math.floor(n/2)] : null;
  const dbMed = n && h.base!=null ? pitchOk.map(s=>s.rel).sort((a,b)=>a-b)[Math.floor(n/2)] : null;
  const ok = n>=20 && richIn>=0.7 && dbIn>=0.7;
  const note=hmTarget(); H.results.push({note, ok, rich:med, db:dbMed, pitch:n/Math.max(1,sm.length)});
  // 기록 저장
  const L=(h.log[today()] = h.log[today()]||{}); const x=(L[note]=L[note]||{tries:0,ok:0,richSum:0,richN:0});
  x.tries++; if(ok) x.ok++; if(med!=null){ x.richSum+=med; x.richN++; } save();
  const el=document.getElementById('hmPhase');
  const sungMed = sm.length ? sm.map(x=>x.m).sort((a,b)=>a-b)[Math.floor(sm.length/2)] : null;
  if(el) el.textContent = n<20 ? (sm.length>=20 ? `음높이가 달라요 · ${koMidi(Math.round(sungMed))} 냄, 목표 ${koName(note)}` : '소리가 잘 안 잡혔어요 · 폰을 한 뼘 거리로') : ok ? `성공! 배음 ${med.toFixed(0)}dB` :
    richIn<0.7 ? (med<g.lo ? `배음 ${med.toFixed(0)}dB · 조금 더 밝고 단단하게` : `배음 ${med.toFixed(0)}dB · 너무 누름, 힘 빼기`) : `크기 ${dbMed>0?'+':''}${dbMed.toFixed(1)}dB · 기준 크기로`;
  try{ navigator.vibrate && navigator.vibrate(ok?[30,40,30]:20); }catch(e){}
  if(ok) beep(1320,0.1);
}
function hmAdvance(){ const n=hmNotes().length; if(n<=1) return; let i=H.noteIdx+H.dir; if(i>=n){ H.dir=-1; i=n-2; } if(i<0){ H.dir=1; i=1; } H.noteIdx=i; }
function hmStop(showSummary=true){
  if(!H) return; clearInterval(H.iv);
  if(H.rec){ try{ H.rec.onstop=()=>{ const blob=new Blob(H.chunksSaved||[], {type:H.rec.mimeType||'audio/webm'}); hmDownload(blob); }; H.chunksSaved=H.chunks; H.rec.stop(); }catch(e){} }
  const res=H.results; H=null; stopMic(); keepAwake(false);
  if(showSummary && res.length){ const ok=res.filter(r=>r.ok).length; toast(`${res.length}회 중 ${ok}회 성공`); }
  hmCheckUnlock(); render();
}
function hmDownload(blob){
  if(!blob.size) return;
  if(window.self!==window.top){ toast('미리보기에서는 녹음 저장이 안 돼요 (설치한 앱에서 가능)'); return; }

}
// 다음 음 열기: 지금 가장 높은 음에서 성공 15회 + 마지막으로 연 뒤 7일
function hmUnlockInfo(){
  const h=hmState(); const top=HM_NOTES[h.top]; let ok=0;
  Object.entries(h.log).forEach(([d,L])=>{ if(diff(h.unlockedAt,d)>=0 && L[top]) ok+=L[top].ok; });
  const days=diff(h.unlockedAt,today());
  return { top, ok, need:15, days, needDays:7, can: ok>=15 && days>=7 && h.top<HM_NOTES.length-1 };
}
function hmCheckUnlock(){ const u=hmUnlockInfo(), h=hmState(); if(u.can){ h.top++; h.unlockedAt=today(); save(); toast(`새 음이 열렸어요: ${koName(HM_NOTES[h.top])}`); } }
function hmRecent(){ // 최근 7일 음별 평균 배음·성공률
  const h=hmState(), out={};
  for(let i=0;i<7;i++){ const L=h.log[addDays(today(),-i)]; if(!L) continue;
    Object.entries(L).forEach(([n,x])=>{ const o=(out[n]=out[n]||{tries:0,ok:0,rs:0,rn:0}); o.tries+=x.tries; o.ok+=x.ok; o.rs+=x.richSum; o.rn+=x.richN; }); }
  return out;
}

// 곡 데이터는 이 기기에만 저장 (localStorage 'sovt-songs-v1'), 백업 파일에는 포함되지 않음
const SONG_KEY = 'sovt-songs-v1';
const KO_SOL = ['도','도#','레','레#','미','파','파#','솔','솔#','라','라#','시'];
const SCI_N  = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NATURAL = new Set([0,2,4,5,7,9,11]);
const koOct = m => { const n=Math.round(m), pc=((n%12)+12)%12, o=Math.floor(n/12)-1; return { ko:`${o-2}옥타브 ${KO_SOL[pc]}`, sol:KO_SOL[pc], oct:o-2, sci:SCI_N[pc]+o, pc }; };
let hmView = 'song';      // 'song' | 'trainer'
let SONGS = [];
function songsLoad(){ try{ const r=localStorage.getItem(SONG_KEY); SONGS = r ? JSON.parse(r) : []; if(!Array.isArray(SONGS)) SONGS=[]; }catch(e){ SONGS=[]; } }
function songsSave(){ try{ localStorage.setItem(SONG_KEY, JSON.stringify(SONGS)); return true; }catch(e){ toast('저장 공간이 부족해요'); return false; } }
function spCfg(){
  if(!S.sp) S.sp = { song:null, speed:1, key:0, guide:'alt', loop:false, reps:0, countIn:true, metro:false, vol:0.6, mic:true, swing:{} };

// ---------- 곡 불러오기 ----------
async function spImportFile(f){
  try{
    const d=JSON.parse(await f.text());
    const list = Array.isArray(d.songs) ? d.songs : (d.notes ? [d] : null);
    if(!list || !list.length) throw new Error('bad');
    let n=0;
    list.forEach(s=>{
      if(!s || !s.id || !Array.isArray(s.notes) || !s.notes.length || !s.bpm) return;
      const i=SONGS.findIndex(x=>x.id===s.id);
      const clean={ id:String(s.id).slice(0,40), title:String(s.title||s.id).slice(0,60), artist:String(s.artist||'').slice(0,60), bpm:+s.bpm, swing:!!s.swing,
        notes:s.notes.map(n=>({t:+n.t, d:+n.d, p:+n.p, l:String(n.l||'').slice(0,20)})).filter(n=>isFinite(n.t)&&isFinite(n.d)&&isFinite(n.p)&&n.d>0),
        phrases:(s.phrases||[]).map(p=>({s:+p.s, e:+p.e, label:String(p.label||'').slice(0,30)})), measures:(s.measures||[]).map(m=>({t:+m.t, len:+m.len})) };
      if(!clean.phrases.length) clean.phrases=[{s:clean.notes[0].t, e:clean.notes[clean.notes.length-1].t+clean.notes[clean.notes.length-1].d, label:'전체'}];
      if(i>=0) SONGS[i]=clean; else SONGS.push(clean); n++;
    });
    if(!n) throw new Error('bad');
    if(songsSave()){ const c=spCfg(); if(!c.song || !SONGS.some(s=>s.id===c.song)) c.song=SONGS[0].id; save(); spSelect(c.song, true); toast(`${n}곡을 불러왔어요`); render(); }
  }catch(e){ toast('곡 파일이 아니에요. 받은 .json 파일을 선택해 주세요'); }
}

// ---------- 곡 준비 (스윙·키 반영) ----------
let SP = null;   // 실행 상태
let spRaf = null;
function swingWarp(b, on){ if(!on) return b; const fl=Math.floor(b), f=b-fl; return Math.abs(f-0.5)<0.01 ? fl+2/3 : b; }
function spPrepare(song){
  const c=spCfg(), sw = song.swing && c.swing[song.id]!==false;
  const notes = song.notes.map((n,i)=>({ i, s:swingWarp(n.t,sw), e:swingWarp(n.t+n.d,sw), p:n.p, l:n.l }));
  const phrases = song.phrases.map((p,i)=>({ i, s:swingWarp(p.s,sw), e:swingWarp(p.e,sw), label:p.label }));
  const end = Math.max(...notes.map(n=>n.e));
  const bpb = (t)=>{ const ms=song.measures||[]; let len=4; for(const m of ms){ if(m.t<=t+1e-6) len=m.len; else break; } return len; };
  return { song, notes, phrases, end, swing:sw, bpb };
}
function spSelect(id, keepPos){
  const song=SONGS.find(s=>s.id===id); if(!song) return;
  spStop(true);
  const c=spCfg(); c.song=id; save();
  const prev = SP && SP.song && SP.song.id===id ? SP : null;
  SP = { ...spPrepare(song), playing:false, pos: prev&&keepPos?prev.pos:(spPrepare(song).notes[0].s-1), t0:0, startBeat:0, A:0, B:0, repN:0, pass:'listen',
         trace:[], sched:[], schedPos:0, lastPh:-1, lastNote:-1, yMid:null, ySpan:14, live:{m:null,r:null,db:null,t:0}, results:{}, flash:null };
  SP.A = SP.B = Math.max(0, SP.phrases.findIndex(p=>p.e>SP.pos));
}
const spBps = () => SP.song.bpm*spCfg().speed/60;     // 초당 박
const spNoteAt = b => { for(const n of SP.notes){ if(n.s<=b && b<n.e) return n; if(n.s>b) break; } return null; };
const spPhraseAt = b => { const ph=SP.phrases; let k=0; for(let i=0;i<ph.length;i++){ if(ph[i].s<=b+1.05) k=i; else break; } return k; };   // 다음 소절이 1박 안이면 미리 표시
function spScoreDue(upto){   // 끝난 소절 채점 (재생 시작 뒤에 처음부터 부른 소절만)
  const ph=SP.phrases;
  while(SP.scoreNext<ph.length && upto>ph[SP.scoreNext].e+0.3){
    const i=SP.scoreNext++; if(ph[i].s>=SP.startBeat-1.05 && spScoring()){ const r=spScorePhrase(i); if(r) spFlash(i,r); }
  }
}
const spTarget = n => n ? n.p + spCfg().key : null;
const spHz = m => 440*Math.pow(2,(m-69)/12);

// ---------- 재생 ----------
function spGuideOn(){ const g=spCfg().guide; if(g==='off') return false; if(g==='on') return true; return !spCfg().loop || SP.pass==='listen'; }
function spScoring(){ const c=spCfg(); return c.mic && mic.on && !(c.guide==='alt' && c.loop && SP.pass==='listen'); }
async function spPlay(fromBeat){
  if(P){ toast('루틴이 끝난 뒤에 해주세요'); return; }
  if(H) hmStop(false);
  const a=ac(); if(!a){ toast('소리를 낼 수 없는 환경이에요'); return; }
  const c=spCfg();
  if(c.mic && !mic.on){ S.pitch=true; const ok=await startMic(); if(!ok) toast(mic.err||'마이크 없이 가이드만 재생해요'); }
  spCutAudio();
  const bps=spBps(), b = fromBeat!=null ? fromBeat : SP.pos;
  const cnt = c.countIn ? SP.bpb(b) : 0;                       // 한 마디 카운트인
  SP.trace = SP.trace.filter(s=>s.b < b-0.01);
  SP.startBeat = b; SP.t0 = a.currentTime + 0.12 + cnt/bps; SP.schedPos = b - cnt; SP.playing=true; SP.countBeats=cnt;
  // 카운트인 클릭
  for(let k=0;k<cnt;k++) spClick(SP.t0 - (cnt-k)/bps, k===0);
  SP.lastPh=-1; SP.scoreNext=Math.max(0,SP.phrases.findIndex(p=>p.e>b+0.01)); if(SP.scoreNext<0) SP.scoreNext=SP.phrases.length; keepAwake(true);
  clearInterval(SP.iv); SP.iv=setInterval(spSchedule, 25);
  spPaintControls();
}
function spPause(){ if(!SP||!SP.playing) return; SP.pos=spNow(); SP.playing=false; clearInterval(SP.iv); spCutAudio(); keepAwake(false); spPaintControls(); }
function spStop(silent){
  if(!SP) return; clearInterval(SP.iv); SP.playing=false; spCutAudio(); keepAwake(false);
  if(mic.on && !P && !H) stopMic();
  if(!silent) spPaintControls();
}
function spNow(){ if(!SP.playing) return SP.pos; const a=ac(); return SP.startBeat + (a.currentTime - SP.t0)*spBps(); }
let spOut=null;
function spDest(){ const a=ac(); if(!spOut){ spOut=a.createGain(); spOut.gain.value=1; spOut.connect(a.destination); } return spOut; }
function spCutAudio(){ try{ spOut && spOut.disconnect(); }catch(e){} spOut=null; if(SP) SP.sched=[]; }
function spClick(t, accent){
  const a=ac(); if(!a || t < a.currentTime-0.01) return;
  const o=a.createOscillator(), g=a.createGain(); o.type='square'; o.frequency.value=accent?1600:1100;
  o.connect(g); g.connect(spDest()); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.12,t+0.003); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.start(t); o.stop(t+0.06);
}
function spVoice(freq, t0, dur){
  const a=ac(), d=spDest(), vol=0.22*spCfg().vol;
  const g=a.createGain(), f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=2600; g.connect(f); f.connect(d);
  const o1=a.createOscillator(), o2=a.createOscillator(), g2=a.createGain();
  o1.type='triangle'; o1.frequency.value=freq; o2.type='sine'; o2.frequency.value=freq*2; g2.gain.value=0.25;
  o1.connect(g); o2.connect(g2); g2.connect(g);
  const rel=Math.min(0.08, dur*0.3), end=t0+Math.max(0.06,dur);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.02);
  g.gain.setValueAtTime(vol*0.85,Math.max(t0+0.03,end-rel)); g.gain.exponentialRampToValueAtTime(0.0001,end);
  o1.start(t0); o2.start(t0); o1.stop(end+0.02); o2.stop(end+0.02);
}
function spSchedule(){
  if(!SP || !SP.playing) return;
  const a=ac(), bps=spBps(), now=spNow(), ahead=now+0.3*bps, c=spCfg();
  const tAt = b => SP.t0 + (b-SP.startBeat)/bps;
  // 가이드음
  if(spGuideOn()){
    for(const n of SP.notes){
      if(n.s<SP.schedPos-1e-6) continue; if(n.s>=ahead) break;
      const from = c.loop ? Math.max(SP.startBeat, SP.phrases[SP.A].s-0.01) : SP.startBeat;
      if(n.s>=from-1e-6 && n.s<=spEndBeat()) spVoice(spHz(spTarget(n)), tAt(n.s), (n.e-n.s)/bps*0.97);
    }
  }
  // 메트로놈
  if(c.metro){ for(let b=Math.ceil(SP.schedPos-1e-6); b<ahead; b++){ if(b>=SP.startBeat) spClick(tAt(b), false); } }
  SP.schedPos = Math.max(SP.schedPos, ahead);
  // 구간 끝 처리
  if(now >= spEndBeat()+0.6) spEndOfRange();
}
function spEndBeat(){ return spCfg().loop ? SP.phrases[SP.B].e : SP.end; }
function spEndOfRange(){
  const c=spCfg();
  spScoreDue(spNow()+1);
  SP.lastPh=-2;
  if(!c.loop){ spPause(); SP.pos=SP.notes[0].s-1; toast('끝까지 불렀어요'); spPaintControls(); return; }
  SP.repN++;
  if(c.reps && SP.repN >= c.reps*(c.guide==='alt'?2:1)){ spPause(); SP.pos=SP.phrases[SP.A].s-0.5; SP.repN=0; SP.pass='listen'; toast('구간 반복을 마쳤어요'); spPaintControls(); return; }
  if(c.guide==='alt') SP.pass = SP.pass==='listen' ? 'sing' : 'listen';
  spPause(); setTimeout(()=>{ if(SP && !SP.playing && spCfg().loop) spPlay(spLoopStart()); }, 700);
}
function spLoopStart(){ return Math.max(SP.notes[0].s-1, SP.phrases[SP.A].s - 1); }

// ---------- 측정 & 채점 ----------
let spLastAn=0;
function spMeasure(){
  const t=performance.now();
  if(!mic.on || t-spLastAn<30) return; spLastAn=t;
  const f=detectPitch();
  let db=null; if(mic.buf){ const b=mic.buf, N=2048; let s=0; for(let i=b.length-N;i<b.length;i++) s+=b[i]*b[i]; db=20*Math.log10(Math.sqrt(s/N)+1e-9); }
  const m = f>0 ? 69+12*Math.log2(f/440) : null, r = f>0 ? measureRich(f) : null;
  SP.live = { m, r: r!=null ? (SP.live.r==null ? r : SP.live.r*0.7+r*0.3) : (t-SP.live.t>500?null:SP.live.r), db, t: m!=null?t:SP.live.t };
  if(SP.playing){
    const b=spNow() - 0.12*spBps();     // 마이크·분석 지연(약 0.12초) 보정
    if(b>=SP.startBeat-0.1){ SP.trace.push({b, m, r, sc:spScoring()}); if(SP.trace.length>6000) SP.trace.splice(0,1000); }
  }
}
function spScorePhrase(i){
  const ph=SP.phrases[i]; if(!ph) return null;
  const bps=spBps(), grace=0.08*bps;
  let tot=0, hit=0, voiced=0, rs=0, rn=0;
  for(const s of SP.trace){
    if(!s.sc || s.b<ph.s || s.b>ph.e) continue;
    const n=spNoteAt(s.b); if(!n || s.b-n.s<grace) continue;
    // 타이밍 여유: ±0.12초 안의 앞뒤 음과 맞아도 정답
    const tol=0.12*bps, alt=[spNoteAt(s.b-tol), spNoteAt(s.b+tol)];
    tot++; if(s.m!=null){ voiced++; const ok=[n,...alt].some(x=>x && Math.abs(s.m-spTarget(x))<=0.5); if(ok){ hit++; if(s.r!=null){ rs+=s.r; rn++; } } }
  }
  if(tot<8 || voiced<tot*0.25) return null;
  const res={ acc:Math.round(hit/tot*100), rich: rn? rs/rn : null };
  const L=(S.spLog[SP.song.id]=S.spLog[SP.song.id]||{}), x=(L[i]=L[i]||{best:0,last:0,n:0});
  x.last=res.acc; x.best=Math.max(x.best,res.acc); x.n++; save();
  SP.results[i]=res; return res;
}

// ---------- 그리기 ----------
function spDraw(){
  const cv=document.getElementById('spCanvas'); if(!cv || !SP) return;
  const box=cv.parentElement.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  const W=box.width, Hh=box.height; if(W<10) return;
  if(cv.width!==Math.round(W*dpr) || cv.height!==Math.round(Hh*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(Hh*dpr); }
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,Hh);
  const cs=getComputedStyle(document.documentElement), col=k=>cs.getPropertyValue(k).trim();
  const C={ink:col('--ink'), sub:col('--sub'), line:col('--line'), acc:col('--accent'), tint:col('--tint'), tint2:col('--tint2'), ok:col('--ok'), card:col('--card')};
  const now=spNow(), bps=spBps(), key=spCfg().key;
  const winSec=W<420?5.5:7, winB=winSec*bps, PH=0.3, LM=60;
  const b0=now-winB*PH, b1=now+winB*(1-PH);
  const X=b=>LM+(b-b0)/(b1-b0)*(W-LM-4);
  // 세로 범위: 보이는 음표 기준 부드럽게
  const vis=SP.notes.filter(n=>n.e>b0-winB*0.3 && n.s<b1+winB*0.5);
  let lo=Infinity, hi=-Infinity; vis.forEach(n=>{ lo=Math.min(lo,n.p+key); hi=Math.max(hi,n.p+key); });
  if(SP.live.m!=null){ lo=Math.min(lo,SP.live.m); hi=Math.max(hi,SP.live.m); }
  if(!isFinite(lo)){ lo=SP.yMid!=null?SP.yMid-6:57; hi=lo+12; }
  const span=Math.max(13, hi-lo+5), mid=(lo+hi)/2;
  if(SP.yMid==null){ SP.yMid=mid; SP.ySpan=span; }
  SP.yMid += (mid-SP.yMid)*0.08; SP.ySpan += (span-SP.ySpan)*0.08;
  const ylo=SP.yMid-SP.ySpan/2, yhi=SP.yMid+SP.ySpan/2, top=10, bot=Hh-26;
  const Y=m=>bot-(m-ylo)/(yhi-ylo)*(bot-top), rowH=(bot-top)/(yhi-ylo);
  // 격자 + 음 이름 (도는 옥타브까지 크게)
  g.font='11px "IBM Plex Sans KR",system-ui,sans-serif'; g.textBaseline='middle';
  for(let m=Math.ceil(ylo); m<=Math.floor(yhi); m++){
    const k=koOct(m), y=Y(m);
    if(k.pc===0){ g.fillStyle=C.tint; g.fillRect(LM,y-rowH/2,W-LM,rowH); }
    g.strokeStyle=C.line; g.lineWidth=k.pc===0?1.2:0.6; g.beginPath(); g.moveTo(LM,y); g.lineTo(W,y); g.stroke();
    if(k.pc===0){ g.fillStyle=C.ink; g.font='600 11px "IBM Plex Sans KR",system-ui,sans-serif'; g.fillText(`${k.oct}옥타브 도`,4,y); g.font='11px "IBM Plex Sans KR",system-ui,sans-serif'; }
    else if(NATURAL.has(k.pc) && rowH>=7){ g.fillStyle=C.sub; g.fillText(k.sol,30,y); }
  }
  // 소절 반복 구간 표시
  if(spCfg().loop){ const a=SP.phrases[SP.A], z=SP.phrases[SP.B]; g.fillStyle=C.tint; g.globalAlpha=0.55;
    const xa=Math.max(LM,X(a.s)), xz=Math.min(W,X(z.e)); if(xz>xa) g.fillRect(xa,0,xz-xa,6); g.globalAlpha=1; }
  // 가이드 막대 + 가사
  const curN=spNoteAt(now);
  for(const n of vis){
    const x0=X(n.s), x1=X(n.e)-1.5, m=n.p+key, y=Y(m), h=Math.max(8,Math.min(22,rowH*0.82));
    if(x1<LM || x0>W) continue;
    const past=n.e<now, cur=n===curN;
    g.globalAlpha = past ? 0.35 : 1;
    g.fillStyle = cur ? C.acc : C.tint2; g.strokeStyle=C.acc; g.lineWidth=cur?0:1;
    const xx=Math.max(LM,x0), ww=Math.max(3,x1-xx);
    g.beginPath(); g.roundRect ? g.roundRect(xx,y-h/2,ww,h,Math.min(5,h/2)) : g.rect(xx,y-h/2,ww,h); g.fill(); if(!cur) g.stroke();
    if(ww>16 && h>=10){ g.fillStyle = cur ? col('--accent-ink') : C.ink; g.font='600 10px "IBM Plex Sans KR",system-ui,sans-serif'; g.textAlign='left'; g.fillText(koOct(m).sol, xx+3, y+0.5); }
    if(n.l){ g.fillStyle = cur ? C.acc : C.ink; g.font=(cur?'700 ':'500 ')+'12px "IBM Plex Sans KR",system-ui,sans-serif'; g.textAlign='left'; g.fillText(n.l, Math.max(LM,x0), y+h/2+9); }
    g.globalAlpha=1; g.textAlign='left';
  }
  // 내 음정 선
  g.lineWidth=3; g.lineCap='round'; let prev=null;
  for(const s of SP.trace){
    if(s.b<b0-0.5 || s.b>now+0.05){ prev=null; continue; }
    if(s.m==null){ prev=null; continue; }
    const n=spNoteAt(s.b), tg=spTarget(n), okc = tg==null ? C.sub : Math.abs(s.m-tg)<=0.5 ? C.ok : '#d9534f';
    if(prev && s.b-prev.b < 0.25*bps){ g.strokeStyle=okc; g.beginPath(); g.moveTo(X(prev.b),Y(prev.m)); g.lineTo(X(s.b),Y(s.m)); g.stroke(); }
    prev=s;
  }
  // 지금 위치
  const xp=X(now); g.strokeStyle=C.ink; g.globalAlpha=0.5; g.lineWidth=1.5; g.beginPath(); g.moveTo(xp,0); g.lineTo(xp,Hh-20); g.stroke(); g.globalAlpha=1;
  if(SP.live.m!=null && performance.now()-SP.live.t<250){ g.fillStyle='#e0a400'; g.beginPath(); g.arc(xp,Y(SP.live.m),6,0,7); g.fill(); }
  // 카운트인
  if(SP.playing && now<SP.startBeat){ const left=Math.ceil(SP.startBeat-now); g.fillStyle=C.acc; g.font='700 48px "IBM Plex Sans KR",system-ui,sans-serif'; g.textAlign='center'; g.fillText(String(left), (LM+W)/2, Hh/2); g.textAlign='left'; }
  // 진행 바
  const p0=SP.notes[0].s, pr=Math.max(0,Math.min(1,(now-p0)/(SP.end-p0)));
  g.fillStyle=C.line; g.fillRect(LM,Hh-8,W-LM-4,4); g.fillStyle=C.acc; g.fillRect(LM,Hh-8,(W-LM-4)*pr,4);
}
function spLoop(){
  if(!document.getElementById('spCanvas')){ spRaf=null; return; }
  if(SP){
    spMeasure(); spDraw(); spPaintLive();
    // 소절 바뀜 → 채점·가사 갱신
    const now=spNow(), pi=spPhraseAt(now);
    if(SP.playing) spScoreDue(now);
    if(pi!==SP.lastPh){ SP.lastPh=pi; spPaintLyrics(); spPaintChips(); }
    const n=spNoteAt(now), ni=n?n.i:-1; if(ni!==SP.lastNote){ SP.lastNote=ni; spPaintLyricHi(); }
  }
  spRaf=requestAnimationFrame(spLoop);
}
function spFlash(i,r){ SP.flash={i, r, t:performance.now()}; const el=document.getElementById('spResult'); if(el){ el.innerHTML=`<b>${i+1}소절 음정 ${r.acc}%</b>${r.rich!=null?` · 배음 ${r.rich.toFixed(0)}dB`:''}`; el.className='sp-result '+(r.acc>=80?'good':r.acc>=55?'mid':'low'); } }

// ---------- 화면 조각 갱신 ----------
function spPaintLive(){
  const el=id=>document.getElementById(id); if(!el('spNow')) return;
  const L=SP.live, fresh=L.m!=null && performance.now()-L.t<300, n=spNoteAt(spNow()), tg=spTarget(n);
  if(fresh){ const k=koOct(L.m); el('spNow').textContent=k.ko; el('spNowSci').textContent=k.sci; }
  else if(performance.now()-L.t>600){ el('spNow').textContent='—'; el('spNowSci').textContent=mic.on?'소리를 내 주세요':'마이크 꺼짐'; }
  el('spTgt').textContent = tg!=null ? koOct(tg).ko : '—';
  const cents = fresh && tg!=null ? Math.round((L.m-tg)*100) : null;
  el('spCents').textContent = cents==null ? '' : Math.abs(cents)<=50 ? `맞음 ${cents>0?'+':''}${cents}¢` : Math.abs(cents)<100 ? `${cents>0?'높음':'낮음'} ${cents>0?'+':''}${cents}¢` : `반음 ${Math.round(Math.abs(cents)/100)}개 ${cents>0?'높음':'낮음'}`;
  el('spCents').className = 'sp-cents '+(cents==null?'':Math.abs(cents)<=50?'ok':'bad');
  const g=HM_GOALS[hmState().goal];
  if(L.r!=null && fresh){ el('spRich').textContent=`${L.r.toFixed(0)}dB`; el('spRich').className='sp-rich '+(L.r>=g.lo&&L.r<=g.hi?'ok':L.r<g.lo?'low':'high'); }
  else if(!fresh){ el('spRich').textContent='—'; el('spRich').className='sp-rich'; }
}
function spPaintLyrics(){
  const box=document.getElementById('spLyrics'); if(!box||!SP) return;
  const now=spNow(), i=spPhraseAt(now), ph=SP.phrases[i], nx=SP.phrases[i+1];
  const words=ns=>ns.map(n=>{ const h=/^[가-힣]$/.test(n.l); return `<span data-n="${n.i}" class="${h?'h':'w'}">${esc(n.l)}</span>`; }).join('');
  const inPh=p=>SP.notes.filter(n=>n.l && n.s>=p.s-0.01 && n.s<p.e);
  box.innerHTML = `<div class="sp-ln"><em>${i+1}</em>${words(inPh(ph))}</div>${nx?`<div class="sp-ln next"><em>${i+2}</em>${words(inPh(nx))}</div>`:''}`;
  spPaintLyricHi();
}
function spPaintLyricHi(){ const box=document.getElementById('spLyrics'); if(!box) return; box.querySelectorAll('span.on').forEach(s=>s.classList.remove('on'));
  if(SP.lastNote>=0){ const s=box.querySelector(`span[data-n="${SP.lastNote}"]`); if(s) s.classList.add('on'); } }
function spPaintChips(){
  const box=document.getElementById('spPhrases'); if(!box||!SP) return;
  const c=spCfg(), cur=spPhraseAt(spNow()), L=S.spLog[SP.song.id]||{};
  box.querySelectorAll('button[data-sp="ph"]').forEach(b=>{ const i=+b.dataset.i;
    b.classList.toggle('on', c.loop ? (i>=SP.A && i<=SP.B) : i===cur); b.classList.toggle('cur', i===cur && SP.playing); });
  const cb=box.querySelector('button.cur'); if(cb && SP.playing){ const r=cb.getBoundingClientRect(), br=box.getBoundingClientRect(); if(r.left<br.left || r.right>br.right) box.scrollTo({left:cb.offsetLeft-16, behavior:'smooth'}); }
}
function spPaintControls(){
  const el=id=>document.getElementById(id); if(!el('spPlay')||!SP) return;
  const c=spCfg();
  el('spPlay').innerHTML = SP.playing ? '❚❚ 일시정지' : '▶ 재생';
  el('spPlay').classList.toggle('primary', !SP.playing);
  el('spLoopInfo').textContent = c.loop ? `${SP.A+1}${SP.B>SP.A?'~'+(SP.B+1):''}소절 반복${c.reps?` · ${c.reps}회`:''}${c.guide==='alt'?` · 지금 ${SP.pass==='listen'?'듣기':'부르기'}`:''}` : '처음부터 끝까지';
  el('spMode').textContent = !SP.playing ? '' : (c.guide==='alt' && c.loop) ? (SP.pass==='listen'?'듣기 차례 · 가이드음을 들어요':'부르기 차례 · 가이드음 없이 불러요') : (c.guide!=='off' && c.mic && mic.on ? '이어폰을 끼면 더 정확해요' : '');
  spPaintChips();
}

// ---------- 화면 ----------
function renderSong(){
  songsLoad(); const c=spCfg();
  if(!SONGS.length){
    return `<header class="top"><div><div class="dday" style="font-size:24px">노래 연습</div><div class="dsub">악보 멜로디를 따라 부르며 음정 맞추기</div></div>
        <button class="btn" style="flex:none" data-sp="trainer">배음 설정</button></header>
      <section class="card"><h3>곡 파일을 먼저 불러와 주세요</h3>
        <p class="muted" style="margin:8px 0 0;line-height:1.6">받은 곡 파일(.json)을 한 번 불러오면 이 폰에만 저장돼요. 사이트에는 올라가지 않아요.</p>
        <div class="actions"><button class="btn primary" data-sp="import">곡 파일 불러오기</button></div></section>`;
  }
  if(!SP || !SONGS.some(s=>s.id===SP.song.id) || (c.song && SP.song.id!==c.song)) spSelect(SONGS.some(s=>s.id===c.song)?c.song:SONGS[0].id);
  const song=SP.song, L=S.spLog[song.id]||{}, g=HM_GOALS[hmState().goal];
  const chip=(k,v,label)=>`<button class="chip ${String(c[k])===String(v)?'on':''}" data-sp="cfg" data-k="${k}" data-v="${v}">${label}</button>`;
  const rng=[Math.min(...song.notes.map(n=>n.p)), Math.max(...song.notes.map(n=>n.p))].map(m=>koOct(m+c.key).ko);

}
function spMount(){
  if(!SP) return;
  if(!spRaf) spRaf=requestAnimationFrame(spLoop);
  SP.lastPh=-2; spPaintLyrics(); spPaintControls();
  const cv=document.getElementById('spCanvas');
  if(cv){ cv.onclick = e=>{ const r=cv.getBoundingClientRect(); if(e.clientY>r.bottom-22){ const f=Math.max(0,Math.min(1,(e.clientX-r.left-60)/(r.width-64))); const b=SP.notes[0].s+(SP.end-SP.notes[0].s)*f; spSeek(b); } }; }
}
function spLeave(){ if(SP && SP.playing) spPause(); if(SP && mic.on && !P && !H) stopMic(); }
function spSeek(b){ const was=SP.playing; if(was) spPause(); SP.pos=b; SP.trace=[]; SP.lastPh=-2; if(spCfg().loop){ SP.A=SP.B=spPhraseAt(b+1); } if(was) spPlay(b); else { spPaintLyrics(); spPaintControls(); } }
function spGoPhrase(i){
  i=Math.max(0,Math.min(SP.phrases.length-1,i)); const c=spCfg();
  if(c.loop){ SP.A=i; if(SP.B<i) SP.B=i; SP.repN=0; SP.pass='listen'; }
  const was=SP.playing; if(was) spPause(); SP.pos=Math.max(SP.notes[0].s-1, SP.phrases[i].s-1); SP.lastPh=-2;
  if(was) spPlay(SP.pos); else { spPaintLyrics(); spPaintControls(); }
}

// ---------- 이벤트 ----------
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-sp]'); if(!b || b.tagName==='SELECT' || b.type==='range') return;
  const a=b.dataset.sp, c=spCfg();
  switch(a){
    case 'trainer': if(SP) spLeave(); hmView='trainer'; render(); window.scrollTo(0,0); return;
    case 'back': hmView='song'; if(H) hmStop(false); render(); window.scrollTo(0,0); return;
    case 'import': document.getElementById('songFile').click(); return;
    case 'del': if(!SP) return; if(confirm(`"${SP.song.title}"을(를) 이 폰에서 지울까요?`)){ spStop(true); SONGS=SONGS.filter(s=>s.id!==SP.song.id); songsSave(); SP=null; c.song=SONGS[0]?.id||null; save(); render(); } return;
    case 'play': if(!SP) return; if(SP.playing) spPause(); else spPlay(c.loop && (SP.pos<SP.phrases[SP.A].s-1.01 || SP.pos>SP.phrases[SP.B].e) ? spLoopStart() : SP.pos); return;
    case 'prev': spGoPhrase(spPhraseAt(spNow()) - (spNow()-SP.phrases[spPhraseAt(spNow())].s > 1.5 ? 0 : 1)); return;
    case 'next': spGoPhrase(spPhraseAt(spNow())+1); return;
    case 'ph': spGoPhrase(+b.dataset.i); return;
    case 'loop': c.loop=!c.loop; save(); if(c.loop){ SP.A=SP.B=spPhraseAt(spNow()); SP.repN=0; SP.pass='listen'; } render(); return;
    case 'bplus': SP.B=Math.min(SP.phrases.length-1,SP.B+1); spPaintControls(); return;
    case 'bminus': SP.B=Math.max(SP.A,SP.B-1); spPaintControls(); return;
    case 'cfg': { const k=b.dataset.k, v=b.dataset.v; c[k] = (k==='guide') ? v : +v; save();
      if(k==='speed' && SP.playing){ const p=spNow(); spPause(); spPlay(p); }
      if(k==='guide'){ SP.pass='listen'; SP.repN=0; }
      render(); return; }
    case 'key': { const v=+b.dataset.v; c.key = v===0 ? 0 : Math.max(-12,Math.min(12,c.key+v)); save(); if(SP.playing){ const p=spNow(); spPause(); spPlay(p); } render(); return; }
    case 'tog': { const k=b.dataset.k; c[k]=!c[k]; save(); if(k==='mic' && !c.mic && mic.on && !P && !H) stopMic(); render(); return; }
    case 'swing': { c.swing[SP.song.id] = c.swing[SP.song.id]===false; save(); const id=SP.song.id; spSelect(id,true); render(); return; }
  }
});
document.addEventListener('change', e=>{

});
document.addEventListener('input', e=>{ const t=e.target; if(t.dataset.sp==='vol'){ spCfg().vol=+t.value; save(); } });

let D=null;
function renderSetup(){
  if(!D) D={song:S.song, voice:S.voice, startDate:S.startDate, targetDate:S.targetDate, endDate:S.endDate};
  const okT=diff(D.startDate,D.targetDate)>=27, okE=diff(D.targetDate,D.endDate)>=28, ok=okT&&okE;
  const keep=S; S={...S,...D};  // 미리보기 계산용
  const road = ok ? [1,2,3].map(p=>{ const [a,b]=phaseRange(p); return `<div><span><b>${p}단계 · ${PHASES[p].name}</b><br><span class="muted">${PHASES[p].desc}</span></span><span class="muted">${md(a)}~${md(b)}</span></div>`; }).join('') : '';
  S=keep;
  return `<div class="setup">
    <h1>발성 훈련 시작하기</h1>
    <p class="muted" style="margin:0 0 16px">목표 곡과 날짜를 정하면 6개월 플랜이 3단계로 나뉘고, 매일 루틴이 자동으로 짜여요.</p>

      <label class="field" style="margin-top:0"><span>목표 곡</span><input type="text" data-draft="song" value="${esc(D.song)}" placeholder="예: 팝콘"></label>

        <button class="chip ${D.voice!=='high'?'on':''}" data-act="draftv" data-k="voice" data-v="low">낮은 목소리</button>

      <label class="field"><span>목표일 (곡을 부를 날)</span><input type="date" data-draft="targetDate" value="${D.targetDate}"></label>
      <label class="field"><span>완성일 (보통 시작 후 6개월)</span><input type="date" data-draft="endDate" value="${D.endDate}"></label>
